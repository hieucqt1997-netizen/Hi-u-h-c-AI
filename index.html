<head>

<meta name="mobile-web-app-capable" content="yes">

<!-- ================= PHẦN 1: TRANG TRÍ (CSS) ================= -->
<style>
/* ================= GIAO DIỆN (CSS) ================= */
:root{
  --bg:#f4f6f8; --card:#ffffff; --text:#1d2733; --muted:#5f6b78; --line:#e1e6ec;
  --pri:#0b6e6e; --pri-2:#e3f2f1; --ok:#1e8a4c; --ok-2:#e5f5ec; --bad:#c0392b; --bad-2:#fdecea;
  --warn:#b7791f; --warn-2:#fdf4e3; --code:#f1f3f5;
  --radius:14px; --nav-h:64px;
  --font: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
[data-theme="dark"]{
  --bg:#0f1418; --card:#182027; --text:#e6edf3; --muted:#9aa7b4; --line:#2a343d;
  --pri:#4fc3b8; --pri-2:#163432; --ok:#4cc38a; --ok-2:#143323; --bad:#ff7b6b; --bad-2:#3a1c19;
  --warn:#f0b452; --warn-2:#3a2c12; --code:#11181d;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:17px;line-height:1.6;
  -webkit-text-size-adjust:100%; padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom));}
a{color:var(--pri)}
h1,h2,h3,h4{line-height:1.3;margin:1.1em 0 .5em}
h1{font-size:1.45rem} h2{font-size:1.25rem} h3{font-size:1.1rem} h4{font-size:1rem}
header.top{position:sticky;top:0;z-index:20;background:var(--card);border-bottom:1px solid var(--line);
  padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;gap:10px}
header.top .title{font-weight:700;font-size:1.05rem;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header.top button{background:none;border:none;color:var(--text);font-size:1.3rem;padding:4px 8px;cursor:pointer}
main{max-width:860px;margin:0 auto;padding:14px 14px 30px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin:0 0 14px}
.card h2:first-child,.card h3:first-child{margin-top:0}
.muted{color:var(--muted);font-size:.92rem}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:520px){.grid2{grid-template-columns:1fr}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--card);
  color:var(--text);border-radius:10px;padding:10px 14px;font-size:1rem;cursor:pointer;font-family:inherit;min-height:44px}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff}
[data-theme="dark"] .btn.pri{color:#06201e}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.bad{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.sm{padding:6px 10px;min-height:34px;font-size:.9rem}
.btn.block{width:100%}
.btn:disabled{opacity:.5}
.pill{display:inline-block;padding:2px 10px;border-radius:99px;font-size:.8rem;background:var(--pri-2);color:var(--pri);font-weight:600}
.pill.ok{background:var(--ok-2);color:var(--ok)} .pill.bad{background:var(--bad-2);color:var(--bad)} .pill.warn{background:var(--warn-2);color:var(--warn)}
.progress{height:10px;background:var(--line);border-radius:99px;overflow:hidden}
.progress>div{height:100%;background:var(--pri);border-radius:99px;transition:width .3s}
.stat{display:flex;flex-direction:column;background:var(--bg);border-radius:10px;padding:10px 12px}
.stat b{font-size:1.35rem}
.stat span{font-size:.82rem;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
/* Danh sách */
.list{list-style:none;margin:0;padding:0}
.list li{border-top:1px solid var(--line);padding:12px 4px;display:flex;gap:10px;align-items:center;cursor:pointer}
.list li:first-child{border-top:none}
.list .num{width:34px;height:34px;flex:0 0 34px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  background:var(--bg);font-weight:700;font-size:.9rem}
.list .num.done{background:var(--ok);color:#fff}
.list .grow{flex:1;min-width:0}
.list .t{font-weight:600}
/* Nội dung bài học */
.lesson p{margin:.5em 0}
.lesson table,.tbl{border-collapse:collapse;width:100%;font-size:.93rem;margin:.6em 0;display:block;overflow-x:auto}
.lesson th,.lesson td,.tbl th,.tbl td{border:1px solid var(--line);padding:7px 9px;text-align:left;vertical-align:top}
.lesson th,.tbl th{background:var(--pri-2)}
.lesson blockquote{margin:.8em 0;padding:10px 14px;border-left:4px solid var(--pri);background:var(--pri-2);border-radius:8px}
.lesson ul,.lesson ol{padding-left:1.3em}
.codebox{margin:.8em 0;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--code)}
.codebox .bar{display:flex;justify-content:space-between;align-items:center;padding:4px 6px 4px 12px;font-size:.8rem;color:var(--muted);border-bottom:1px solid var(--line)}
.codebox pre{margin:0;padding:12px;overflow-x:auto;white-space:pre-wrap;word-break:break-word;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.86rem;line-height:1.5}
/* Trắc nghiệm */
.q{margin:14px 0}
.q .opt{display:block;width:100%;text-align:left;margin:6px 0;border:1px solid var(--line);background:var(--card);color:var(--text);
  border-radius:10px;padding:10px 12px;font-size:.98rem;cursor:pointer;font-family:inherit}
.q .opt.right{background:var(--ok-2);border-color:var(--ok)}
.q .opt.wrong{background:var(--bad-2);border-color:var(--bad)}
.q .exp{font-size:.9rem;color:var(--muted);margin-top:4px}
/* Thẻ ghi nhớ */
.flash{min-height:190px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:1.15rem;
  padding:24px;border-radius:var(--radius);background:var(--pri-2);cursor:pointer;user-select:none}
.flash.back{background:var(--card);border:2px solid var(--pri);font-size:1.02rem}
/* Form */
label{display:block;font-size:.88rem;color:var(--muted);margin:8px 0 3px}
input,select,textarea{width:100%;padding:10px 11px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--text);
  font-size:16px;font-family:inherit}
textarea{min-height:90px;resize:vertical}
input[type=checkbox],input[type=radio]{width:auto}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{flex:1;border:none;background:var(--card);color:var(--text);padding:9px 6px;font-size:.95rem;cursor:pointer;font-family:inherit;border-left:1px solid var(--line)}
.seg button:first-child{border-left:none}
.seg button.on{background:var(--pri);color:#fff}
[data-theme="dark"] .seg button.on{color:#06201e}
/* Cảnh báo */
.alert{border-radius:12px;padding:14px 16px;margin:0 0 14px;border:1px solid}
.alert.bad{background:var(--bad-2);border-color:var(--bad);color:var(--text)}
.alert.ok{background:var(--ok-2);border-color:var(--ok)}
.alert.warn{background:var(--warn-2);border-color:var(--warn)}
.alert h3{margin:0 0 6px}
.stopscreen{text-align:center;padding:26px 16px}
.stopscreen .big{font-size:2.1rem;font-weight:800;color:var(--bad);letter-spacing:.5px}
/* Đồng hồ */
.timer{font-size:2.6rem;font-weight:800;font-variant-numeric:tabular-nums;text-align:center}
.stages{display:flex;gap:6px}
.stages div{flex:1;text-align:center;font-size:.8rem;padding:6px 2px;border-radius:8px;background:var(--bg);color:var(--muted)}
.stages div.on{background:var(--pri);color:#fff;font-weight:700}
/* Thanh điều hướng */
nav.bottom{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:1px solid var(--line);
  display:flex;padding-bottom:env(safe-area-inset-bottom);height:calc(var(--nav-h) + env(safe-area-inset-bottom))}
nav.bottom a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-decoration:none;color:var(--muted);font-size:.7rem;gap:2px}
nav.bottom a .i{font-size:1.35rem;line-height:1}
nav.bottom a.on{color:var(--pri);font-weight:700}
@media (min-width:1000px){
  body{padding-bottom:0;padding-left:210px}
  nav.bottom{top:0;right:auto;width:210px;height:auto;flex-direction:column;justify-content:flex-start;border-top:none;border-right:1px solid var(--line);padding-top:70px}
  nav.bottom a{flex:0 0 auto;flex-direction:row;justify-content:flex-start;gap:12px;padding:12px 20px;font-size:.98rem}
}
.toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + 20px);transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:10px;
  z-index:99;font-size:.95rem;opacity:0;transition:opacity .25s;pointer-events:none;max-width:90%}
.toast.show{opacity:.95}
.hl{background:var(--warn-2);border-radius:3px}
.tabs{display:flex;gap:6px;overflow-x:auto;margin:0 0 12px;padding-bottom:2px}
.tabs a{white-space:nowrap;text-decoration:none;padding:7px 12px;border-radius:99px;background:var(--card);border:1px solid var(--line);color:var(--text);font-size:.92rem}
.tabs a.on{background:var(--pri);border-color:var(--pri);color:#fff}
[data-theme="dark"] .tabs a.on{color:#06201e}
.trade{border-top:1px solid var(--line);padding:10px 2px}
.trade:first-child{border-top:none}
.small{font-size:.85rem}
.right{text-align:right}
hr{border:none;border-top:1px solid var(--line);margin:14px 0}

</style>
</head>

<!-- ================= PHẦN 3: DỮ LIỆU BÀI HỌC (sửa ở đây để thêm bài) ================= -->
<script id="du-lieu-bai-hoc">
/* =====================================================================
   DỮ LIỆU BÀI HỌC — SỔ TAY HỌC AI
   ---------------------------------------------------------------------
   Phần này CHỈ chứa nội dung. Muốn thêm/sửa bài học, chỉ sửa ở đây,
   không cần đụng tới phần giao diện bên dưới.

   Mỗi buổi học là một đối tượng { ... } trong mảng SESSIONS:
     id       : số thứ tự buổi (1..30)
     week     : thuộc tuần mấy (1..4)
     title    : tên buổi
     goal     : mục tiêu (1 câu)
     practice : bài thực hành trên máy tính (tóm tắt 1 câu)
     practiceDetail : hướng dẫn thực hành chi tiết (markdown như content)
     ready    : true = đã có nội dung đầy đủ; false = mới có khung
     content  : nội dung bài, viết kiểu "markdown đơn giản":
                  ## Tiêu đề lớn      ### Tiêu đề nhỏ
                  - gạch đầu dòng     1. đánh số
                  > khung ghi chú
                  | bảng | có | cột |
                  **chữ đậm**
                  ~~~prompt  ... ~~~   (khối prompt, có nút Sao chép)
                  ~~~python  ... ~~~   (khối code)
     summary  : 3 dòng tóm tắt
     quiz     : [{ q: câu hỏi, a: [đáp án...], c: số thứ tự đáp án đúng (0 là đầu tiên), e: giải thích }]
     cards    : [{ f: mặt trước, b: mặt sau }]   (thẻ ghi nhớ)

   LƯU Ý: nội dung đặt giữa hai dấu ` (dấu huyền). Trong nội dung
   KHÔNG được gõ dấu ` và không gõ ký hiệu $ đứng liền dấu {.
   ===================================================================== */

const WEEKS = [
  { id: 1, title: "Tuần 1 – Hiểu AI và nói chuyện với AI", goal: "Biết AI hoạt động ra sao, hay sai ở đâu, và giao việc cho AI đúng cách." },
  { id: 2, title: "Tuần 2 – Lập trình vừa đủ hiểu", goal: "Đọc hiểu code AI viết, chạy được script Python đầu tiên, biết báo lỗi cho AI sửa." },
  { id: 3, title: "Tuần 3 – Ứng dụng chạy thế nào & tự động hóa văn phòng", goal: "Hiểu app offline, API, Agent; tự động hóa Excel/Word; bảo mật dữ liệu." },
  { id: 4, title: "Tuần 4 – AI với trading và kiếm tiền", goal: "Dùng AI để giữ kỷ luật và quản lý rủi ro; chọn hướng kiếm tiền hợp với kế toán." }
];

const SESSIONS = [
/* ============================ TUẦN 1 ============================ */
{
id: 1, week: 1, ready: true,
title: "AI là gì? Vì sao AI trả lời được",
goal: "Hiểu mô hình ngôn ngữ lớn (LLM) hoạt động bằng cách đoán chữ tiếp theo, từ đó biết AI giỏi gì và yếu gì.",
practice: "Làm 3 thí nghiệm nhỏ với AI để tự thấy điểm mạnh, điểm yếu của nó.",
content: `
## AI mà bạn đang dùng là loại nào?
"AI" là một từ rất rộng. Thứ bạn dùng hằng ngày như Claude, ChatGPT, Gemini thuộc một loại cụ thể: **mô hình ngôn ngữ lớn**, tiếng Anh là Large Language Model, viết tắt **LLM**.

"Mô hình" ở đây là một chương trình máy tính rất lớn. "Ngôn ngữ" nghĩa là nó làm việc với chữ. "Lớn" nghĩa là nó được cho đọc một lượng văn bản khổng lồ: sách, báo, trang web, tài liệu, code...

## Nó "học" như thế nào?
Hãy nghĩ đến chính bạn. Làm kế toán lâu năm, nhìn dòng đầu của một biên bản giao nhận thực phẩm là bạn đoán được gần hết các dòng sau: tên hàng, đơn vị tính, số lượng, đơn giá, thành tiền, chữ ký các bên. Bạn không cần thuộc lòng từng biên bản, vì đã nhìn đủ nhiều để nắm **quy luật**.

LLM học theo cách tương tự nhưng ở quy mô cực lớn. Trong giai đoạn **huấn luyện**, máy đọc hàng tỷ trang văn bản và liên tục tự tập: "với đoạn chữ này, chữ tiếp theo hợp lý nhất là gì?". Đoán sai thì tự chỉnh lại. Lặp đi lặp lại vô số lần, nó nắm được quy luật của ngôn ngữ, cách lập luận, cách viết code, cả văn phong hành chính.

## Nó "trả lời" như thế nào?
Đây là điểm quan trọng nhất của cả khóa học:

> AI **không tra cứu** câu trả lời trong một cuốn sổ như Excel tra bảng. Nó **viết ra từng mẩu chữ một**, mỗi lần chọn mẩu hợp lý nhất dựa trên toàn bộ những gì đã có phía trước.

Ví dụ bạn gõ: "Biên bản giao nhận thực ..." thì mẩu chữ tiếp theo hợp lý nhất là "phẩm". Cứ thế nối dài thành câu, thành đoạn, thành cả văn bản.

## Hệ quả: AI giỏi gì, yếu gì?
| Giỏi | Yếu |
| Viết, sửa văn, tóm tắt, đổi giọng văn | Con số cần chính xác tuyệt đối (khi không cho nó dùng công cụ tính) |
| Giải thích khái niệm khó cho dễ hiểu | Thông tin mới xảy ra sau thời điểm nó được huấn luyện |
| Viết code, công thức Excel | Số hiệu văn bản, điều khoản, tên người cụ thể nó không chắc |
| Chuyển định dạng: bảng → văn bản, văn bản → bảng | Biết "hôm nay" là ngày nào nếu không được cho biết |
| Gợi ý ý tưởng, lập dàn ý | Dự đoán tương lai (ví dụ giá vàng ngày mai) |

Vì AI luôn cố viết ra câu "nghe hợp lý", khi không biết nó vẫn có thể viết rất trơn tru, gọi là **"bịa"**. Buổi 3 sẽ học kỹ cách phát hiện và phòng tránh.

## Phép so sánh dễ nhớ
> Hãy coi AI như **một nhân viên mới cực kỳ chăm đọc**: viết nhanh, biết nhiều, nhưng không có sổ sách của cơ quan bạn, không biết hôm nay ngày mấy nếu bạn không nói, và rất ngại trả lời "tôi không biết". Giao việc phải rõ ràng, và **luôn kiểm tra** trước khi ký.

## AI có "công cụ" thì khác
Ngày nay nhiều trợ lý AI được trang bị công cụ: tìm kiếm web, chạy code, đọc file Excel/PDF, tạo file. Khi có công cụ, AI có thể **tính bằng code** thay vì "đoán" con số, và **tra web** thay vì dựa vào trí nhớ cũ.

Bài học thực tế cho kế toán: khi cần số liệu chính xác, hãy yêu cầu rõ: "Hãy dùng code (hoặc công thức Excel) để tính, không tính nhẩm."

## Vì sao cần hiểu điều này?
Mọi kỹ năng ở các buổi sau (viết prompt, kiểm soát AI, nhờ AI làm app, dùng AI trong trading) đều dựa trên một ý: **AI là cỗ máy viết chữ hợp lý, không phải cỗ máy biết sự thật.** Bạn là người cầm lái và chịu trách nhiệm cuối cùng.
`,
summary: [
  "LLM học quy luật ngôn ngữ từ lượng văn bản khổng lồ, rồi trả lời bằng cách viết từng mẩu chữ hợp lý nhất.",
  "AI giỏi viết, giải thích, viết code; yếu về con số chính xác, thông tin mới và chi tiết cụ thể nó không chắc.",
  "Coi AI như nhân viên mới chăm đọc: giao việc rõ, cho dùng công cụ khi cần chính xác, luôn kiểm tra kết quả."
],
practiceDetail: `
### Thí nghiệm 1 – AI có biết hôm nay ngày mấy?
Mở một cuộc trò chuyện mới, gõ:
~~~prompt
Hôm nay là ngày mấy, thứ mấy? Bạn dựa vào đâu để biết?
~~~
Ghi lại: nó trả lời đúng không, và nó giải thích dựa vào đâu.

### Thí nghiệm 2 – Tính nhẩm và tính bằng code
~~~prompt
Cộng giúp tôi các số sau, chỉ ghi kết quả cuối, không dùng công cụ:
1.234.500 + 987.650 + 45.300 + 2.310.000 + 76.890 + 512.340 + 3.045.600 + 88.120 + 701.230 + 1.999.990
~~~
Sau đó gõ tiếp:
~~~prompt
Bây giờ hãy dùng code để tính lại chính xác và so sánh với kết quả trước. Nếu khác, giải thích vì sao.
~~~
(Đáp án đúng: 11.001.620)

title: "Token, cửa sổ ngữ cảnh và giới hạn kiến thức",
goal: "Hiểu vì sao AI 'quên', vì sao cuộc trò chuyện dài làm AI kém đi, và vì sao AI không biết quy định mới.",
practice: "Thử nghiệm AI quên giữa các cuộc trò chuyện và kiểm tra AI với một quy định mới.",
content: `
## Token – đơn vị "đếm chữ" của AI
AI không đọc chữ như người. Nó cắt văn bản thành những mẩu nhỏ gọi là **token**. Một token có thể là một từ, một phần của từ, hoặc dấu câu.

- Tiếng Việt có dấu thường bị cắt thành **nhiều token hơn** tiếng Anh cho cùng một ý.
- Giới hạn sử dụng của các gói AI (miễn phí hay trả phí) thường được tính theo token.
- Dán một file dài vào = tiêu tốn nhiều token.

Bạn không cần đếm token. Chỉ cần nhớ: **càng dài càng tốn**, và mọi thứ đều có giới hạn.

## Cửa sổ ngữ cảnh – "cái bàn làm việc" của AI
Hãy tưởng tượng AI ngồi ở một cái bàn. Mọi thứ trong cuộc trò chuyện (câu bạn hỏi, câu nó trả lời, file bạn dán vào) đều được bày lên bàn. Mỗi lần trả lời, AI nhìn lại **toàn bộ mặt bàn**.

Cái bàn này gọi là **cửa sổ ngữ cảnh** (context window). Nó rất rộng nhưng **có giới hạn**. Khi cuộc trò chuyện quá dài:
- Phần đầu có thể bị tóm tắt lại hoặc bị đẩy khỏi bàn → AI "quên" yêu cầu ban đầu.
- AI dễ lẫn lộn giữa các phiên bản (ví dụ biên bản tháng 9 và tháng 10).
- Trả lời chậm hơn, tốn lượt dùng hơn.

### Mẹo dùng bàn làm việc hiệu quả
1. **Mỗi việc một cuộc trò chuyện mới.** Làm biên bản thì mở chat riêng, hỏi trading thì mở chat riêng.
2. Khi chat đã quá dài, nhờ AI: "Tóm tắt các quyết định quan trọng của cuộc trò chuyện này trong 10 dòng", rồi dán bản tóm tắt sang chat mới.
3. Đưa tài liệu nền vào **Project** (dự án) để không phải dán lại mỗi lần (học kỹ ở buổi 6).

## AI có nhớ bạn không?
Mặc định: **mỗi cuộc trò chuyện là một tờ giấy trắng.** Chat hôm qua AI không thấy được ở chat hôm nay, trừ khi:
- Bạn dùng tính năng **bộ nhớ** (memory): AI tự ghi lại vài điều về bạn để dùng lại.
- Bạn làm việc trong cùng một **Project** có tài liệu và hướng dẫn chung.

Vì vậy nếu AI "quên" bạn là kế toán hay quên cách bạn muốn trình bày, đó không phải lỗi; bạn cần đưa thông tin đó vào bộ nhớ hoặc Project.

## Giới hạn kiến thức (knowledge cutoff)
AI được huấn luyện đến một thời điểm nhất định rồi dừng. Những gì xảy ra **sau** thời điểm đó, nó không biết, trừ khi được tìm web hoặc bạn dán tài liệu vào.

Ví dụ thực tế: một thông tư, nghị định mới ban hành có thể nằm ngoài kiến thức của AI. Nếu bạn hỏi, nó có thể trả lời theo **quy định cũ** một cách rất tự tin.

> Quy tắc: Với quy định pháp luật, giá cả, tỷ giá, tin tức, hãy **bật tìm kiếm web** và yêu cầu nêu nguồn, hoặc **dán văn bản gốc** vào và bảo AI chỉ trả lời dựa trên văn bản đó.

## Tóm lại bằng hình ảnh
| Khái niệm | Hình ảnh dễ nhớ | Việc bạn cần làm |
| Token | Mẩu chữ, đơn vị tính tiền/lượt | Đừng dán thừa, chỉ đưa phần cần thiết |
| Cửa sổ ngữ cảnh | Cái bàn làm việc có giới hạn | Mỗi việc một chat; chat dài thì tóm tắt sang chat mới |
| Bộ nhớ / Project | Sổ tay ghi chú về bạn / tủ hồ sơ chung | Lưu thông tin cố định một lần, dùng nhiều lần |
| Giới hạn kiến thức | Người đi xa lâu ngày mới về | Cho tìm web hoặc dán văn bản mới vào |
`,

content: `
## "Bịa" (hallucination) là gì?
Là khi AI đưa ra thông tin **sai nhưng trình bày rất tự tin**, câu chữ trơn tru như thật. Tiếng Anh gọi là hallucination (ảo giác).

Những thứ AI hay bịa nhất:
- **Số hiệu văn bản, điều, khoản**: ví dụ "Theo khoản 3 Điều 12 Thông tư số ..." nhưng điều khoản đó không tồn tại hoặc nói chuyện khác.
- **Con số, tỷ lệ, thống kê** không có nguồn.
- **Tên người, chức vụ, tên đơn vị.**
- **Trích dẫn** câu nói, bài báo.
- **Hàm Excel, thư viện lập trình** không có thật.
- **Đường link** dẫn tới trang không tồn tại.

## Vì sao AI bịa?
Nhớ lại buổi 1: AI viết chữ **hợp lý nhất**, không phải chữ **đúng nhất**. Một số hiệu văn bản có hình thức "xx/2025/TT-BCA" trông rất hợp lý, nên AI có thể viết ra dù không có văn bản đó.

## Dấu hiệu cảnh báo
- Có số liệu, số hiệu rất cụ thể nhưng **không có nguồn**.
- Hỏi lại cùng câu, **mỗi lần ra một đáp án khác**.
- Câu trả lời **quá đúng ý bạn**, không có chỗ nào "không chắc".
- Bạn hỏi "nguồn ở đâu?" thì AI **xin lỗi và đổi đáp án**.

## 6 cách kiểm tra
1. **Yêu cầu nêu nguồn, rồi tự mở nguồn.** Không mở được nguồn = chưa được dùng.
2. **Dán văn bản gốc vào** và ra lệnh: chỉ trả lời dựa trên văn bản này.
3. **Cho phép AI nói "không biết"**: "Nếu không chắc chắn, hãy ghi Không chắc chắn, đừng đoán."
4. **Con số thì tính bằng code hoặc Excel**, không tin số tính nhẩm.
5. **Hỏi lại theo cách khác**, hoặc hỏi một công cụ AI thứ hai để đối chiếu.
6. **Tự đối chiếu trước khi ký, nộp, gửi.** Người ký là bạn, không phải AI.

## Mẫu prompt "chống bịa" dùng hằng ngày
~~~prompt
Chỉ dựa trên văn bản tôi dán bên dưới để trả lời. Quy tắc:
- Mỗi ý trả lời phải ghi rõ lấy từ điều/khoản/đoạn nào của văn bản.
- Nếu văn bản không đề cập, ghi đúng câu: "Văn bản không đề cập".
- Không dùng kiến thức bên ngoài, không suy đoán.

Câu hỏi: [câu hỏi của bạn]

Văn bản:
[dán văn bản vào đây]
~~~

## Áp dụng vào công việc kế toán
> Quy tắc vàng: **Con số và căn cứ pháp lý luôn phải kiểm tra.** AI được dùng để soạn nhanh, sắp xếp, gợi ý; còn số tiền, định mức, số hiệu văn bản thì bạn đối chiếu với chứng từ và văn bản gốc.

## Áp dụng vào trading
Nếu AI nói "vàng tuần sau khả năng cao sẽ tăng", đó chỉ là **một đoạn chữ nghe hợp lý**, không phải dự báo có cơ sở. AI không biết tương lai. Ở Tuần 4 bạn sẽ học cách dùng AI đúng chỗ trong trading: phân tích **chính bạn** (nhật ký, kỷ luật), không phải đoán giá.
`,

## Các nhóm công cụ AI
> Lưu ý: tên gói, tính năng và giá của các công cụ AI **thay đổi rất nhanh**. Thông tin dưới đây là khung để hiểu; giá và tính năng cụ thể **cần kiểm tra lại** trên trang chính thức.

| Nhóm | Ví dụ | Dùng để |
| Trợ lý trò chuyện | Claude (Anthropic), ChatGPT (OpenAI), Gemini (Google), Copilot (Microsoft) | Hỏi đáp, soạn văn bản, phân tích file, viết code |
| AI trong công cụ văn phòng | AI tích hợp trong Word/Excel/Google Docs/Sheets | Làm việc ngay trong file đang mở |
| AI lập trình | Các công cụ viết code tự động (ví dụ Claude Code) | Làm app, script tự động hóa |
| AI tạo ảnh, video, giọng nói | Các công cụ tạo ảnh/video | Thiết kế, video tuyên truyền |
| AI tìm kiếm | Trợ lý có tìm web và trích nguồn | Tra cứu thông tin mới |

## Tiêu chí chọn công cụ cho bạn
1. **Tiếng Việt tốt**: hiểu đúng ý, viết văn hành chính tự nhiên.
2. **Đọc được file**: Excel, Word, PDF bạn đưa vào.
3. **Chạy code / tạo file**: tính toán chính xác, xuất file Excel/Word.
4. **Tìm web có nguồn**: cho thông tin mới.
5. **Bảo mật**: có cài đặt không dùng dữ liệu của bạn để huấn luyện hay không; chính sách lưu trữ.
6. **Giá và giới hạn**: bản miễn phí thường giới hạn số lượt và model yếu hơn.

## Miễn phí hay trả phí?
- **Miễn phí**: đủ để học và làm việc nhẹ. Hay bị giới hạn lượt, file, tính năng.
- **Trả phí**: model mạnh hơn, nhiều lượt hơn, có Project, đọc file lớn, chạy code.
- Nguyên tắc: **dùng miễn phí đến khi thấy rõ mình bị giới hạn ở đâu**, rồi mới trả phí cho đúng thứ cần.

## Lời khuyên: 1 chính, 1 phụ
- Chọn **1 công cụ chính** và học dùng thật thành thạo (Project, bộ nhớ, đọc file, chạy code). Thành thạo một công cụ giá trị hơn biết sơ sơ năm công cụ.
- Giữ **1 công cụ phụ** để đối chiếu khi gặp câu trả lời quan trọng hoặc đáng ngờ.

## Bảo mật khi chọn công cụ
Dù dùng công cụ nào, **không đưa lên AI**: thông tin mật của cơ quan, dữ liệu cá nhân người cai nghiện (họ tên, ngày sinh, hồ sơ), văn bản nội bộ chưa công khai, số tài khoản, mật khẩu. Buổi 20 sẽ học cách **ẩn danh hóa** dữ liệu trước khi nhờ AI.

{
id: 5, week: 1, ready: true,
title: "Viết prompt 5 phần: Vai trò – Bối cảnh – Nhiệm vụ – Ràng buộc – Định dạng",
goal: "Viết được prompt rõ ràng theo công thức 5 phần, biết đưa ví dụ mẫu và chia nhỏ việc.",
practice: "Viết lại 3 prompt 'xấu' thành prompt tốt và so sánh kết quả.",
content: `
## Prompt là gì?
**Prompt** là câu lệnh, yêu cầu bạn gửi cho AI. Chất lượng câu trả lời phụ thuộc rất lớn vào chất lượng prompt. Giống như giao việc cho nhân viên mới: giao mơ hồ thì nhận về kết quả mơ hồ.

## Công thức 5 phần (nhớ: V-B-N-R-Đ)
| Phần | Trả lời câu hỏi | Ví dụ |
| **V**ai trò | AI nên đóng vai ai? | "Bạn là kế toán đơn vị sự nghiệp công lập có 15 năm kinh nghiệm." |
| **B**ối cảnh | Tình huống, đối tượng, dữ liệu sẵn có? | "Tôi làm ở cơ sở cai nghiện, phụ trách nuôi ăn. Đây là số liệu tháng 10..." |
| **N**hiệm vụ | Cụ thể cần làm gì? | "Lập biên bản giao nhận thực phẩm ngày 15/10." |
| **R**àng buộc | Giới hạn, điều cấm, tiêu chuẩn? | "Dùng thuật ngữ 'người cai nghiện'. Không tự thêm số liệu. Tối đa 1 trang." |
| **Đ**ịnh dạng | Kết quả trình bày ra sao? | "Dạng bảng, có dòng tổng cộng, số tiền ghi bằng chữ." |

Không phải lúc nào cũng cần đủ 5 phần. Việc đơn giản chỉ cần Nhiệm vụ + Định dạng. Việc quan trọng thì dùng đủ.

## So sánh prompt xấu và prompt tốt
### Ví dụ 1 – Văn bản
| Xấu | Tốt |
| "Viết biên bản giao nhận." | "Bạn là kế toán cơ sở cai nghiện. Lập biên bản giao nhận thực phẩm ngày 15/10/2026 giữa nhà cung cấp và bộ phận bếp, gồm 3 mặt hàng tôi liệt kê bên dưới. Có phần thành phần tham dự, bảng hàng hóa (tên, ĐVT, số lượng, đơn giá, thành tiền), tổng tiền bằng số và chữ, phần ký của 3 bên. Không tự thêm mặt hàng." |

### Ví dụ 2 – Excel
| Xấu | Tốt |
| "Công thức Excel tính tổng." | "Trong Excel, cột A là Ngày, cột B là Tên hàng, cột F là Thành tiền (dòng 2 đến 500). Viết công thức tính tổng Thành tiền của 'Gạo' trong tháng 10/2026. Giải thích từng phần công thức bằng tiếng Việt đơn giản." |

### Ví dụ 3 – Trading
| Xấu | Tốt |
| "Vàng có nên mua không?" | "Đóng vai người giám sát kỷ luật giao dịch. Đây là kế hoạch giao dịch của tôi và lệnh tôi định vào. Hãy kiểm tra lệnh này có vi phạm điều nào trong kế hoạch không. Không đưa ý kiến mua hay bán." |

## 3 kỹ thuật nâng cao dễ dùng
### 1. Đưa ví dụ mẫu
AI bắt chước rất giỏi. Thay vì mô tả dài, **dán một mẫu bạn đã làm đúng** và nói: "Làm theo đúng mẫu này cho tháng 11."

### 2. Chia nhỏ việc
Việc lớn chia thành bước: "Bước 1: lập dàn ý. Chờ tôi duyệt rồi mới viết chi tiết." Mỗi bước kiểm tra một lần, sai thì sửa sớm.

### 3. Sửa từng phần, không làm lại từ đầu
Kết quả gần đúng thì góp ý cụ thể: "Giữ nguyên tất cả, chỉ sửa mục 3: thay 'học viên' bằng 'người cai nghiện' và rút gọn còn 5 dòng." Góp ý càng cụ thể, AI sửa càng trúng.

## Mẫu khung prompt để dùng lại
~~~prompt
VAI TRÒ: Bạn là [chuyên gia gì].
BỐI CẢNH: [Tôi là ai, đang làm gì, dữ liệu có sẵn].
NHIỆM VỤ: [Việc cụ thể cần làm].
RÀNG BUỘC:
- [Điều bắt buộc]
- [Điều cấm]
- Nếu thiếu thông tin, hỏi tôi tối đa 3 câu trước khi làm.
ĐỊNH DẠNG: [Bảng / văn bản / gạch đầu dòng, độ dài, ngôn ngữ].
~~~
`,

{

title: "Kiểm soát AI làm đúng ý mình",
goal: "Dùng hướng dẫn cố định (master prompt), Project, bộ nhớ, skill; bắt AI hỏi lại, lập kế hoạch và tự kiểm tra.",
practice: "Viết master prompt cho công việc kế toán của bạn và tạo một Project dùng nó.",
content: `
## Từ "hỏi đáp" sang "điều khiển"
Ở buổi 5 bạn học viết từng prompt. Buổi này học cách **dựng khuôn** để AI lần nào cũng làm theo ý bạn mà không phải dặn lại.

## 4 công cụ kiểm soát
| Công cụ | Giống như | Dùng khi |
| **Master prompt / hướng dẫn cố định** | Bản quy chế làm việc giao cho nhân viên | Muốn AI luôn theo một cách làm (ví dụ: luôn viết câu lệnh trước, chờ lệnh mới làm) |
| **Project (dự án)** | Tủ hồ sơ + quy chế riêng cho từng mảng việc | Một mảng việc lặp lại: nuôi ăn, chấm công, học AI |
| **Bộ nhớ (memory)** | Sổ tay AI ghi về bạn | Thông tin cố định: bạn là ai, thuật ngữ đúng, cách trình bày ưa thích |
| **Skill (kỹ năng)** | Quy trình mẫu đóng gói sẵn | Việc có quy trình chuẩn: soạn văn bản theo thể thức, làm phim... |

> Bạn đã dùng cả 4 thứ này rồi! Chính cách bạn yêu cầu AI "viết câu lệnh trước, khi tôi gõ HÃY THỰC THI PROMPT NÀY mới làm" là một **master prompt** đặt trong **Project**. App bạn đang học được tạo ra theo đúng quy trình đó.

Tên gọi và cách bật các tính năng này khác nhau giữa các công cụ AI, cần xem hướng dẫn của công cụ bạn dùng.

## 5 câu lệnh kiểm soát nên thuộc lòng
### 1. Bắt AI hỏi lại trước khi làm
~~~prompt
Trước khi làm, hãy hỏi tôi tối đa 3 câu để làm rõ yêu cầu. Chỉ bắt đầu khi tôi trả lời.
~~~
### 2. Bắt AI lập kế hoạch, chờ duyệt
~~~prompt
Đừng làm ngay. Liệt kê các bước bạn định làm và kết quả mỗi bước. Chờ tôi gõ "Duyệt" rồi mới làm.
~~~
### 3. Khóa phạm vi
~~~prompt
Chỉ sửa đúng phần tôi chỉ định. Giữ nguyên toàn bộ phần còn lại, kể cả định dạng.
~~~
### 4. Bắt AI tự kiểm tra
~~~prompt
Trước khi gửi kết quả, hãy tự rà lại theo danh sách sau và sửa lỗi:
1. Tổng tiền có khớp tổng các dòng không?
2. Có dùng từ "học viên" không? (phải là "người cai nghiện")
3. Có số liệu nào tôi không cung cấp mà bạn tự thêm không?
Ghi rõ kết quả rà soát ở cuối.
~~~
### 5. Bắt AI nói rõ chỗ không chắc
~~~prompt
Đánh dấu [CẦN KIỂM TRA] ở bất kỳ chỗ nào bạn không chắc chắn 100%.
~~~

## Vòng lặp làm việc với AI
1. **Giao việc** bằng prompt 5 phần (+ câu kiểm soát).
2. **Xem** kết quả, đối chiếu.
3. **Góp ý cụ thể** từng phần.
4. **Lưu lại** prompt tốt vào thư viện (mục Prompt trong app) hoặc vào Project.
Lần sau chỉ việc lấy ra dùng. Làm vài lần, bạn có cả bộ "công thức" riêng: đó chính là tài sản để làm nhanh hơn và để **kiếm tiền** sau này.

## Giới hạn của sự kiểm soát
- AI vẫn có thể bỏ sót một quy tắc, nhất là khi danh sách quá dài. Quy tắc quan trọng nên đặt **ở đầu và nhắc lại ở cuối**.
- Không có câu lệnh nào thay thế được **bước bạn tự kiểm tra**.

<!-- ================= PHẦN 4: XỬ LÝ (JavaScript) ================= -->
<script>
/* =====================================================================
   PHẦN XỬ LÝ (JavaScript) — SỔ TAY HỌC AI
   Đọc kèm Tuần 3, buổi 15–16: đây chính là "phần hành động" của app.
   ===================================================================== */
'use strict';

/* ---------- 1. LƯU DỮ LIỆU TRÊN MÁY (localStorage) ----------
   Mọi dữ liệu của bạn (đã học buổi nào, điểm, ghi chú, nhật ký giao dịch)
   được lưu ngay trong trình duyệt của máy, không gửi đi đâu cả.
   Tên mỗi mục đều bắt đầu bằng "sthai." để dễ sao lưu. */
const PREFIX = 'sthai.';
const store = {
  get(key, macDinh) {
    try { const v = localStorage.getItem(PREFIX + key); return v == null ? macDinh : JSON.parse(v); }
    catch (e) { return macDinh; }
  },
  set(key, value) {
    try { localStorage.setItem(PREFIX + key, JSON.stringify(value)); return true; }
    catch (e) {
      // Thường do bộ nhớ trình duyệt đầy hoặc đang ở chế độ duyệt riêng tư
      toast('⚠️ Không lưu được dữ liệu: bộ nhớ trình duyệt đã đầy hoặc bị chặn. Hãy vào Thêm → Sao lưu, rồi xóa bớt dữ liệu cũ.', 6000);
      return false;
    }
  }
};

/* ---------- 2. HÀM TIỆN ÍCH NHỎ ---------- */
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad = n => String(n).padStart(2, '0');
const ymd = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const today = () => ymd(new Date());
const addDays = (s, n) => { const d = new Date(s + 'T00:00:00'); d.setDate(d.getDate() + n); return ymd(d); };
const daysBetween = (a, b) => Math.round((new Date(b + 'T00:00:00') - new Date(a + 'T00:00:00')) / 86400000);
const nowLocal = () => { const d = new Date(); return ymd(d) + 'T' + pad(d.getHours()) + ':' + pad(d.getMinutes()); };
const num = v => { const n = parseFloat(String(v).replace(',', '.')); return isNaN(n) ? null : n; };
const money = n => (n == null || isNaN(n)) ? '—' : (n < 0 ? '-' : '') + '$' + Math.abs(n).toLocaleString('vi-VN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const pct = n => (n == null || isNaN(n)) ? '—' : n.toLocaleString('vi-VN', { maximumFractionDigits: 1 }) + '%';
const vnDate = s => { if (!s) return ''; const [d, t] = s.split('T'); const p = d.split('-'); return p[2] + '/' + p[1] + '/' + p[0] + (t ? ' ' + t.slice(0, 5) : ''); };
const bo_dau = s => String(s || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/đ/g, 'd');

let toastTimer;
function toast(msg, ms) {
  let t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), ms || 2200);
}

function copyText(text) {
  const fallback = () => {
    const ta = document.createElement('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.focus(); ta.select();
    try { document.execCommand('copy'); toast('Đã sao chép ✓'); } catch (e) { toast('Không sao chép được, hãy chọn chữ và copy thủ công'); }
    ta.remove();
  };
  if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(text).then(() => toast('Đã sao chép ✓'), fallback);
  else fallback();
}

/* ---------- 3. ĐỌC "MARKDOWN ĐƠN GIẢN" THÀNH GIAO DIỆN ----------
   Nội dung bài học viết dạng chữ thường có ký hiệu (##, -, >, |, ~~~).
   Hàm md() đọc từng dòng và đổi thành HTML để hiển thị. */
function inline(s) { return esc(s).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>'); }
function codeBox(code, lang) {
  const label = lang === 'prompt' ? '📋 Prompt mẫu' : (lang ? '💻 ' + lang : '💻 Code');
  return '<div class="codebox"><div class="bar"><span>' + esc(label) + '</span><button class="btn sm" data-act="copybox">Sao chép</button></div><pre>' + esc(code) + '</pre></div>';
}
function mdTable(rows) {
  rows = rows.filter(r => !/^\|?[\s|:\-]+\|?$/.test(r));
  const cells = r => r.replace(/^\|/, '').replace(/\|$/, '').split('|').map(c => c.trim());
  let h = '<table><thead><tr>' + cells(rows[0]).map(c => '<th>' + inline(c) + '</th>').join('') + '</tr></thead><tbody>';
  rows.slice(1).forEach(r => { h += '<tr>' + cells(r).map(c => '<td>' + inline(c) + '</td>').join('') + '</tr>'; });
  return h + '</tbody></table>';
}
function md(src) {
  const lines = String(src || '').replace(/\r/g, '').split('\n');
  const out = []; let i = 0;
  const isSpecial = t => /^(~~~|##|>|\||- |\d+\. )/.test(t);
  while (i < lines.length) {
    const t = lines[i].trim();
    if (!t) { i++; continue; }
    if (t.startsWith('~~~')) {                       // khối code / prompt
      const lang = t.slice(3).trim(); const buf = []; i++;
      while (i < lines.length && !lines[i].trim().startsWith('~~~')) { buf.push(lines[i]); i++; }
      i++; out.push(codeBox(buf.join('\n'), lang)); continue;
    }
    if (t.startsWith('### ')) { out.push('<h4>' + inline(t.slice(4)) + '</h4>'); i++; continue; }
    if (t.startsWith('## ')) { out.push('<h3>' + inline(t.slice(3)) + '</h3>'); i++; continue; }
    if (t.startsWith('>')) {
      const b = []; while (i < lines.length && lines[i].trim().startsWith('>')) { b.push(lines[i].trim().replace(/^>\s?/, '')); i++; }
      out.push('<blockquote>' + inline(b.join(' ')) + '</blockquote>'); continue;
    }
    if (t.startsWith('|')) {
      const r = []; while (i < lines.length && lines[i].trim().startsWith('|')) { r.push(lines[i].trim()); i++; }
      out.push(mdTable(r)); continue;
    }
    if (t.startsWith('- ')) {
      const b = []; while (i < lines.length && lines[i].trim().startsWith('- ')) { b.push('<li>' + inline(lines[i].trim().slice(2)) + '</li>'); i++; }
      out.push('<ul>' + b.join('') + '</ul>'); continue;
    }
    if (/^\d+\. /.test(t)) {
      const b = []; while (i < lines.length && /^\d+\. /.test(lines[i].trim())) { b.push('<li>' + inline(lines[i].trim().replace(/^\d+\. /, '')) + '</li>'); i++; }
      out.push('<ol>' + b.join('') + '</ol>'); continue;
    }
    const b = [t]; i++;                               // đoạn văn thường
    while (i < lines.length && lines[i].trim() && !isSpecial(lines[i].trim())) { b.push(lines[i].trim()); i++; }
    out.push('<p>' + inline(b.join(' ')) + '</p>');
  }
  return out.join('');
}

/* ---------- 4. TIẾN ĐỘ HỌC ---------- */
const getDone = () => store.get('done', {});              // { số buổi: ngày học xong }
const getDays = () => store.get('days', []);              // danh sách ngày có học
function markStudyDay() {
  const d = getDays(); const t = today();
  if (!d.includes(t)) { d.push(t); store.set('days', d); }
}
function streak() {
  const set = new Set(getDays()); let d = today();
  if (!set.has(d)) d = addDays(d, -1);
  let n = 0; while (set.has(d)) { n++; d = addDays(d, -1); }
  return n;
}
function nextSession() { const done = getDone(); return SESSIONS.find(s => !done[s.id]) || SESSIONS[SESSIONS.length - 1]; }
function progressPct() { return Math.round(Object.keys(getDone()).length / SESSIONS.length * 100); }

/* ---------- 5. ĐỒNG HỒ 60 PHÚT (15 đọc – 35 thực hành – 10 ôn) ---------- */
const STAGES = [{ n: 'Đọc bài', m: 15 }, { n: 'Thực hành', m: 35 }, { n: 'Ôn tập', m: 10 }];
let T = store.get('timer', { stage: 0, left: 15 * 60, run: false, end: 0 });
const timerLeft = () => T.run ? Math.max(0, Math.round((T.end - Date.now()) / 1000)) : T.left;
const saveTimer = () => store.set('timer', T);
function timerTick() {
  if (T.run && timerLeft() <= 0) {
    if (navigator.vibrate) navigator.vibrate([300, 150, 300]);
    if (T.stage < 2) {
      T.stage++; T.left = STAGES[T.stage].m * 60; T.end = Date.now() + T.left * 1000;
      toast('⏰ Chuyển sang: ' + STAGES[T.stage].n, 4000);
    } else {
      T.run = false; T.left = 0; markStudyDay(); toast('🎉 Hoàn thành 60 phút học hôm nay!', 5000);
    }
    saveTimer(); if (route().page === 'hom-nay') render();
  }
  const el = $('timerTxt');
  if (el) { const s = timerLeft(); el.textContent = pad(Math.floor(s / 60)) + ':' + pad(s % 60); }
}
setInterval(timerTick, 1000);

/* ---------- 6. THẺ GHI NHỚ – ÔN LẶP LẠI NGẮT QUÃNG ----------
   Thẻ "Nhớ rồi" lên hộp cao hơn và lâu mới hiện lại; thẻ "Chưa nhớ" về hộp 1, hiện lại ngay. */
const INTERVALS = [1, 2, 4, 7, 15];  // số ngày chờ theo hộp 1..5
function allCards() {
  const done = getDone(); const out = [];
  SESSIONS.forEach(s => (s.cards || []).forEach((c, i) => out.push({ id: 's' + s.id + '-' + i, sid: s.id, f: c.f, b: c.b, learned: !!done[s.id] })));
  return out;
}
function cardPool() { const all = allCards(); const learned = all.filter(c => c.learned); return learned.length ? learned : all.filter(c => c.sid === 1); }
function dueCards() { const cs = store.get('cards', {}); const t = today(); return cardPool().filter(c => !cs[c.id] || cs[c.id].due <= t); }
function rateCard(id, ok) {
  const cs = store.get('cards', {}); const c = cs[id] || { box: 1, due: today() };
  if (ok) { c.box = Math.min(5, c.box + 1); c.due = addDays(today(), INTERVALS[c.box - 1]); }
  else { c.box = 1; c.due = today(); }
  cs[id] = c; store.set('cards', cs); markStudyDay();
}

/* ---------- 7. GIAO DỊCH: KẾ HOẠCH, NHẬT KÝ, TRẠNG THÁI KỶ LUẬT ---------- */
const DEFAULT_PLAN = {
  capital: 1000, account: 'Demo', riskPct: 1, maxTrades: 3, dayLossPct: 3, weekLossPct: 6,
  stopAfterLosses: 2, minRR: 1.5, pairs: 'XAUUSD, EURUSD', hours: '19:00 – 22:00',
  rules: 'Chỉ vào lệnh khi đủ TẤT CẢ điều kiện:\n1. ...\n2. ...\n3. ...'
};
const getPlan = () => Object.assign({}, DEFAULT_PLAN, store.get('plan', {}));
const getTrades = () => store.get('trades', []);
const weekStart = () => { const d = new Date(); d.setDate(d.getDate() - (d.getDay() + 6) % 7); return ymd(d); };
function tradeStatus() {
  const p = getPlan(), tr = getTrades(), t = today(), ws = weekStart();
  const todayTr = tr.filter(x => (x.time || '').slice(0, 10) === t).sort((a, b) => a.time < b.time ? -1 : 1);
  const weekTr = tr.filter(x => (x.time || '').slice(0, 10) >= ws);
  const sum = arr => arr.reduce((s, x) => s + (num(x.pl) || 0), 0);
  const dayPL = sum(todayTr), weekPL = sum(weekTr);
  let lossStreak = 0; for (let i = todayTr.length - 1; i >= 0; i--) { if ((num(todayTr[i].pl) || 0) < 0) lossStreak++; else break; }
  const cap = num(p.capital) || 0, reasons = [];
  if (todayTr.length >= p.maxTrades) reasons.push('Đã vào ' + todayTr.length + '/' + p.maxTrades + ' lệnh tối đa hôm nay.');
  if (cap && dayPL <= -cap * p.dayLossPct / 100) reasons.push('Lỗ hôm nay ' + money(dayPL) + ' đã chạm giới hạn ' + p.dayLossPct + '% vốn (' + money(-cap * p.dayLossPct / 100) + ').');
  if (cap && weekPL <= -cap * p.weekLossPct / 100) reasons.push('Lỗ tuần này ' + money(weekPL) + ' đã chạm giới hạn ' + p.weekLossPct + '% vốn. Nghỉ đến hết tuần.');
  if (lossStreak >= p.stopAfterLosses) reasons.push('Đã thua ' + lossStreak + ' lệnh liên tiếp hôm nay (quy tắc: dừng sau ' + p.stopAfterLosses + ').');
  return { stop: reasons.length > 0, reasons, count: todayTr.length, dayPL, weekPL, lossStreak, plan: p };
}
function calcStats(list) {
  const tr = list.filter(x => num(x.pl) != null).sort((a, b) => a.time < b.time ? -1 : 1);
  const n = tr.length, w = tr.filter(x => num(x.pl) > 0), l = tr.filter(x => num(x.pl) < 0);
  const sum = a => a.reduce((s, x) => s + num(x.pl), 0);
  let cur = 0, maxStreak = 0; tr.forEach(x => { if (num(x.pl) < 0) { cur++; maxStreak = Math.max(maxStreak, cur); } else cur = 0; });
  const avgWin = w.length ? sum(w) / w.length : null, avgLoss = l.length ? sum(l) / l.length : null;
  return {
    n, wins: w.length, losses: l.length, winRate: n ? w.length / n * 100 : null, total: sum(tr),
    avgWin, avgLoss, rr: (avgWin != null && avgLoss) ? avgWin / Math.abs(avgLoss) : null,
    maxLoss: l.length ? Math.min(...l.map(x => num(x.pl))) : null, maxStreak, perTrade: n ? sum(tr) / n : null
  };
}

/* ---------- 8. ĐIỀU HƯỚNG GIỮA CÁC MÀN HÌNH ----------
   Địa chỉ dạng #/lo-trinh, #/bai/3, #/giao-dich/nhat-ky ... */

  const views = { 'hom-nay': vToday, 'lo-trinh': vRoadmap, 'bai': vLesson, 'on-tap': vReview, 'tu-dien': vGlossary, 'prompt': vPrompts, 'giao-dich': vTrading, 'them': vMore, 'tim-kiem': vSearch };
  const fn = views[r.page] || vToday;
  $('pageTitle').textContent = TITLES[r.page] || 'Sổ tay học AI';
  const navKey = { 'bai': 'lo-trinh', 'tu-dien': 'on-tap', 'tim-kiem': 'them' }[r.page] || r.page;
  $('nav').innerHTML = NAV.map(n => '<a href="#/' + n[0] + '" class="' + (n[0] === navKey ? 'on' : '') + '"><span class="i">' + n[1] + '</span><span>' + n[2] + '</span></a>').join('');
  $('main').innerHTML = fn(r);
  if (r.page === 'giao-dich') afterTradingRender(r);
  timerTick();
}
window.addEventListener('hashchange', () => { render(); window.scrollTo(0, 0); });

/* ====================== MÀN HÌNH: HÔM NAY ====================== */
function vToday() {
  const s = nextSession(), done = getDone(), days = getDays(), p = progressPct();
  let h = '';
  // Nhắc nhở khi bỏ buổi
  if (days.length) {
    const last = days.slice().sort().pop(); const gap = daysBetween(last, today());
    if (gap >= 2) h += '<div class="alert warn"><b>Bạn đã nghỉ ' + (gap - 1) + ' ngày.</b> Không sao, quan trọng là quay lại. Học tiếp buổi ' + s.id + ' ngay hôm nay nhé!</div>';
  } else {
    h += '<div class="alert ok"><b>Chào bạn!</b> Lộ trình gồm 30 buổi, mỗi buổi 60 phút. Bắt đầu từ buổi 1 bên dưới.</div>';
  }
  h += '<div class="card"><div class="row" style="justify-content:space-between"><b>Tiến độ khóa học</b><span class="pill">' + p + '%</span></div>' +
    '<div class="progress" style="margin:10px 0"><div style="width:' + p + '%"></div></div>' +
    '<div class="stats"><div class="stat"><b>' + Object.keys(done).length + '/30</b><span>buổi đã học</span></div>' +
    '<div class="stat"><b>🔥 ' + streak() + '</b><span>ngày học liên tục</span></div>' +
    '<div class="stat"><b>' + dueCards().length + '</b><span>thẻ cần ôn hôm nay</span></div></div></div>';
  // Buổi học hôm nay
  h += '<div class="card"><span class="pill">Tuần ' + s.week + ' · Buổi ' + s.id + '</span>' + (done[s.id] ? ' <span class="pill ok">Đã học</span>' : '') +
    '<h2>' + esc(s.title) + '</h2><p class="muted">🎯 ' + esc(s.goal) + '</p><p class="small">💻 <b>Thực hành:</b> ' + esc(s.practice) + '</p>' +
    (s.ready ? '' : '<p class="small muted">Buổi này mới có khung, nội dung đầy đủ sẽ được bổ sung.</p>') +
    '<a class="btn pri block" href="#/bai/' + s.id + '">Vào học buổi ' + s.id + ' →</a></div>';
  // Đồng hồ
  h += '<div class="card"><b>⏱️ Đồng hồ 60 phút</b><div class="stages" style="margin:10px 0">' +
    STAGES.map((st, i) => '<div class="' + (i === T.stage ? 'on' : '') + '">' + st.n + '<br>' + st.m + ' phút</div>').join('') + '</div>' +
    '<div class="timer" id="timerTxt">--:--</div><div class="row" style="justify-content:center;margin-top:8px">' +
    (T.run ? '<button class="btn" data-act="tPause">⏸ Tạm dừng</button>' : '<button class="btn pri" data-act="tStart">▶ Bắt đầu</button>') +
    '<button class="btn" data-act="tSkip">⏭ Chặng tiếp</button><button class="btn" data-act="tReset">↺ Làm lại</button></div></div>';
  // Gợi ý mỗi ngày: 1 thẻ ghi nhớ
  const due = dueCards();
  if (due.length) {
    const c = due[new Date().getDate() % due.length];
    h += '<div class="card"><b>🧠 Thẻ ghi nhớ hôm nay</b><p style="font-size:1.1rem;margin:.6em 0">' + esc(c.f) + '</p>' +
      '<a class="btn block" href="#/on-tap">Lật thẻ và ôn ' + due.length + ' thẻ →</a></div>';
  }
  // Tình trạng giao dịch
  const st = tradeStatus();
  if (getTrades().length || store.get('plan', null)) {
    h += '<div class="card"><b>📈 Kỷ luật giao dịch hôm nay</b><p class="small">Đã vào ' + st.count + '/' + st.plan.maxTrades + ' lệnh · Lãi/lỗ hôm nay: <b>' + money(st.dayPL) + '</b></p>' +
      (st.stop ? '<div class="alert bad"><b>⛔ DỪNG GIAO DỊCH HÔM NAY</b><br>' + st.reasons.map(esc).join('<br>') + '</div>' : '<span class="pill ok">Trong giới hạn kế hoạch</span>') + '</div>';
  }
  return h;
}

    h += '<div class="card"><h3>Buổi này mới có khung</h3><p>💻 <b>Thực hành dự kiến:</b> ' + esc(s.practice) + '</p>' +

  } else {
    h += '<div class="card lesson"><h3 style="margin-top:0">📖 Đọc bài (15 phút)</h3>' + md(s.content) + '</div>';
    if (s.practiceDetail) h += '<div class="card lesson"><h3 style="margin-top:0">💻 Thực hành trên máy tính (35 phút)</h3>' + md(s.practiceDetail) + '</div>';
    h += '<div class="card"><h3 style="margin-top:0">📝 Tóm tắt 3 dòng</h3><ol>' + (s.summary || []).map(x => '<li>' + esc(x) + '</li>').join('') + '</ol></div>';
    h += '<div class="card"><h3 style="margin-top:0">✅ Trắc nghiệm (10 phút)</h3><div id="quiz">' + quizHtml(s) + '</div></div>';
    if (s.cards && s.cards.length) h += '<div class="card"><h3 style="margin-top:0">🧠 Thẻ ghi nhớ của buổi</h3><p class="small muted">Các thẻ này sẽ vào mục Ôn tập sau khi bạn đánh dấu học xong.</p><ul>' +
      s.cards.map(c => '<li><b>' + esc(c.f) + '</b>: ' + esc(c.b) + '</li>').join('') + '</ul></div>';
  }
  h += '<div class="card"><h3 style="margin-top:0">🗒️ Ghi chú của tôi</h3><textarea id="note" data-sid="' + id + '" placeholder="Ghi lại nhận xét, kết quả thực hành, điều cần nhớ... (tự động lưu)">' + esc(notes[id] || '') + '</textarea></div>';
  h += '<button class="btn ' + (done[id] ? '' : 'ok') + ' block" data-act="toggleDone" data-id="' + id + '">' + (done[id] ? '✓ Đã học xong (bấm để bỏ đánh dấu)' : '✔ Đánh dấu đã học xong buổi này') + '</button>';
  h += '<div class="row" style="justify-content:space-between;margin-top:14px">' + (prev ? '<a class="btn" href="#/bai/' + prev.id + '">← Buổi ' + prev.id + '</a>' : '<span></span>') + (next ? '<a class="btn" href="#/bai/' + next.id + '">Buổi ' + next.id + ' →</a>' : '') + '</div>';
  return h;
}
function quizHtml(s) {
  const st = quizState[s.id] || {}; const best = store.get('quiz', {})[s.id];
  let answered = 0, right = 0;
  let h = (s.quiz || []).map((q, qi) => {
    const chosen = st[qi];
    if (chosen != null) { answered++; if (chosen === q.c) right++; }
    return '<div class="q"><b>Câu ' + (qi + 1) + '.</b> ' + esc(q.q) + q.a.map((a, oi) => {
      let cls = 'opt';
      if (chosen != null) { if (oi === q.c) cls += ' right'; else if (oi === chosen) cls += ' wrong'; }
      return '<button class="' + cls + '" data-act="ans" data-s="' + s.id + '" data-q="' + qi + '" data-o="' + oi + '">' + String.fromCharCode(65 + oi) + '. ' + esc(a) + '</button>';
    }).join('') + (chosen != null ? '<div class="exp">' + (chosen === q.c ? '✅ Đúng. ' : '❌ Chưa đúng. ') + esc(q.e) + '</div>' : '') + '</div>';
  }).join('');
  const total = (s.quiz || []).length;
  if (answered === total && total) {
    h += '<div class="alert ' + (right / total >= .7 ? 'ok' : 'warn') + '"><b>Kết quả: ' + right + '/' + total + ' (' + Math.round(right / total * 100) + '%)</b>' +
      (right / total >= .7 ? ' – Tốt lắm!' : ' – Nên đọc lại bài rồi làm lại.') + '</div><button class="btn" data-act="quizReset" data-s="' + s.id + '">↺ Làm lại</button>';
  } else if (best != null) h += '<p class="small muted">Điểm cao nhất trước đây: ' + best + '%</p>';
  return h;
}

let gFilter = 'Tất cả';
function glossList(q, g) {
  const nq = bo_dau(q);
  const items = GLOSSARY.filter(x => (g === 'Tất cả' || x.g === g) && (!nq || bo_dau(x.en + ' ' + x.vi + ' ' + x.d).includes(nq)));
  if (!items.length) return '<p class="muted">Không tìm thấy.</p>';
  return items.map(x => '<div class="trade"><b>' + esc(x.en) + '</b> – <span style="color:var(--pri)">' + esc(x.vi) + '</span> <span class="pill">' + esc(x.g) + '</span><div class="small">' + esc(x.d) + '</div></div>').join('');
}

/* Đọc file CSV (xử lý dấu phẩy hoặc chấm phẩy, có ngoặc kép) */
function parseCsv(text) {
  text = text.replace(/^\uFEFF/, '');
  const first = text.split('\n')[0]; const d = (first.split(';').length > first.split(',').length) ? ';' : (first.includes('\t') ? '\t' : ',');
  const rows = []; let row = [], cell = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (q) { if (ch === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; } else cell += ch; }
    else if (ch === '"') q = true;
    else if (ch === d) { row.push(cell); cell = ''; }
    else if (ch === '\n') { row.push(cell); rows.push(row); row = []; cell = ''; }
    else if (ch !== '\r') cell += ch;
  }
  if (cell || row.length) { row.push(cell); rows.push(row); }
  return rows;
}
/* Nhập lịch sử MetaTrader 5: tìm dòng tiêu đề có Symbol/Type/Volume/Profit */
function importMt5(text) {
  const rows = parseCsv(text);
  const hi = rows.findIndex(r => { const s = r.map(c => c.trim().toLowerCase()); return s.includes('symbol') && s.includes('profit') && (s.includes('volume') || s.includes('size')); });
  if (hi < 0) return toast('Không nhận ra file. Cần có các cột Symbol, Type, Volume, Profit (xem Hướng dẫn).', 5000);
  const H = rows[hi].map(c => c.trim().toLowerCase());
  const idx = name => H.indexOf(name), all = (name) => H.map((h, i) => h === name ? i : -1).filter(i => i >= 0);
  const times = all('time'), prices = all('price');
  const iSym = idx('symbol'), iType = idx('type'), iVol = idx('volume') >= 0 ? idx('volume') : idx('size'), iSL = idx('s / l') >= 0 ? idx('s / l') : idx('s/l'), iTP = idx('t / p') >= 0 ? idx('t / p') : idx('t/p');
  const iProfit = idx('profit'), iComm = idx('commission'), iSwap = idx('swap');
  const existing = getTrades(), keys = new Set(existing.map(t => t.time + t.sym + t.entry + t.pl));
  let added = 0;
  for (let r = hi + 1; r < rows.length; r++) {
    const c = rows[r]; if (!c || c.length < H.length - 2) break;           // hết bảng Positions
    const type = (c[iType] || '').trim().toLowerCase();
    if (type !== 'buy' && type !== 'sell') continue;
    const n = v => num(String(v || '').replace(/\s/g, '')) || 0;
    const pl = n(c[iProfit]) + (iComm >= 0 ? n(c[iComm]) : 0) + (iSwap >= 0 ? n(c[iSwap]) : 0);
    const tRaw = (c[times[0]] || '').trim().replace(/\./g, '-').replace(' ', 'T').slice(0, 16);
    const t = { id: 'm' + Date.now() + '_' + r, time: tRaw, sym: (c[iSym] || '').trim().toUpperCase(), side: type === 'buy' ? 'Mua' : 'Bán', entry: (c[prices[0]] || '').trim(), exit: prices[1] != null ? (c[prices[1]] || '').trim() : '', sl: iSL >= 0 ? (c[iSL] || '').trim() : '', tp: iTP >= 0 ? (c[iTP] || '').trim() : '', lot: (c[iVol] || '').trim(), pl: String(Math.round(pl * 100) / 100), emo: '', plan: '', moved: '', reason: '', lesson: '', src: 'MT5' };
    const k = t.time + t.sym + t.entry + t.pl; if (keys.has(k)) continue;
    keys.add(k); existing.push(t); added++;
  }
  if (store.set('trades', existing)) { toast('Đã nhập ' + added + ' lệnh mới. Hãy bổ sung cảm xúc, đúng/sai kế hoạch cho từng lệnh.', 5000); render(); }
}

/* --- Thống kê --- */
function groupTable(title, list, keyFn, labels) {
  const groups = {}; list.forEach(t => { const k = keyFn(t); if (k === '' || k == null) return; (groups[k] = groups[k] || []).push(t); });
  const ks = Object.keys(groups).sort(); if (!ks.length) return '';
  return '<h4>' + title + '</h4><table class="tbl"><thead><tr><th>Nhóm</th><th>Số lệnh</th><th>Tỷ lệ thắng</th><th>Tổng lãi/lỗ</th></tr></thead><tbody>' +
    ks.map(k => { const s = calcStats(groups[k]); return '<tr><td>' + esc(labels ? (labels[k] || k) : k) + '</td><td>' + s.n + '</td><td>' + pct(s.winRate) + '</td><td style="color:' + (s.total < 0 ? 'var(--bad)' : 'var(--ok)') + '">' + money(s.total) + '</td></tr>'; }).join('') + '</tbody></table>';
}
function tStats() {
  const tr = getTrades(), s = calcStats(tr);
  if (!s.n) return '<div class="card muted">Chưa có dữ liệu. Ghi nhật ký hoặc nhập file từ MetaTrader trước.</div>';
  let h = '<div class="card"><h3>📊 Tổng quan (' + s.n + ' lệnh)</h3><div class="stats">' +
    '<div class="stat"><b>' + pct(s.winRate) + '</b><span>tỷ lệ thắng (' + s.wins + 'T/' + s.losses + 'B)</span></div>' +
    '<div class="stat"><b style="color:' + (s.total < 0 ? 'var(--bad)' : 'var(--ok)') + '">' + money(s.total) + '</b><span>tổng lãi/lỗ</span></div>' +
    '<div class="stat"><b>' + money(s.avgWin) + '</b><span>lãi trung bình</span></div><div class="stat"><b>' + money(s.avgLoss) + '</b><span>lỗ trung bình</span></div>' +
    '<div class="stat"><b>' + (s.rr != null ? '1 : ' + s.rr.toFixed(2) : '—') + '</b><span>R:R thực tế (lãi TB/lỗ TB)</span></div>' +
    '<div class="stat"><b>' + money(s.maxLoss) + '</b><span>lệnh lỗ lớn nhất</span></div><div class="stat"><b>' + s.maxStreak + '</b><span>chuỗi thua dài nhất</span></div>' +
    '<div class="stat"><b>' + money(s.perTrade) + '</b><span>trung bình mỗi lệnh</span></div></div></div>';
  const tips = [];
  if (s.rr != null && s.rr < 1) tips.push('Lỗ trung bình lớn hơn lãi trung bình: dấu hiệu điển hình của <b>gồng lỗ</b> và chốt lời quá sớm.');
  const cap = num(getPlan().capital); if (cap && s.maxLoss != null && -s.maxLoss > cap * getPlan().riskPct / 100 * 1.5) tips.push('Lệnh lỗ lớn nhất ' + money(s.maxLoss) + ' vượt xa mức rủi ro ' + getPlan().riskPct + '% vốn (' + money(cap * getPlan().riskPct / 100) + '): dấu hiệu <b>vào lệnh quá lớn</b> hoặc không đặt SL.');
  const badPlan = calcStats(tr.filter(t => t.plan === 'Không')), goodPlan = calcStats(tr.filter(t => t.plan === 'Có'));
  if (badPlan.n) tips.push('Lệnh <b>sai kế hoạch</b>: ' + badPlan.n + ' lệnh, tổng ' + money(badPlan.total) + '. Lệnh đúng kế hoạch: ' + goodPlan.n + ' lệnh, tổng ' + money(goodPlan.total) + '.');
  const hot = calcStats(tr.filter(t => t.emo >= 4)); if (hot.n) tips.push('Lệnh vào khi <b>cảm xúc 4–5</b>: ' + hot.n + ' lệnh, tổng ' + money(hot.total) + '.');
  const mv = calcStats(tr.filter(t => t.moved === 'Có')); if (mv.n) tips.push('Lệnh có <b>dời SL</b>: ' + mv.n + ' lệnh, tổng ' + money(mv.total) + '.');
  const noTag = tr.filter(t => !t.emo || !t.plan).length; if (noTag) tips.push(noTag + ' lệnh chưa ghi cảm xúc hoặc đúng/sai kế hoạch. Bổ sung để thống kê chính xác hơn.');
  if (tips.length) h += '<div class="card"><h3>🔎 Điều số liệu đang nói</h3><ul>' + tips.map(t => '<li>' + t + '</li>').join('') + '</ul></div>';
  h += '<div class="card">' + groupTable('Theo mức cảm xúc', tr, t => t.emo, { 1: '1 – Rất bình tĩnh', 2: '2 – Bình tĩnh', 3: '3 – Hơi hồi hộp', 4: '4 – Nóng vội', 5: '5 – Cay cú' }) +
    groupTable('Đúng / sai kế hoạch', tr, t => t.plan, { 'Có': 'Đúng kế hoạch', 'Không': 'Sai kế hoạch' }) +
    groupTable('Có dời dừng lỗ không', tr, t => t.moved, { 'Có': 'Có dời SL', 'Không': 'Không dời SL' }) +
    groupTable('Theo mã', tr, t => t.sym) +
    groupTable('Theo khung giờ vào lệnh', tr, t => (t.time || '').slice(11, 13) ? (t.time.slice(11, 13) + 'h') : '') + '</div>';
  return h;
}

/* ---------- 9. SAO LƯU / KHÔI PHỤC ---------- */
function downloadFile(name, text, type) {
  const blob = new Blob([text], { type: type || 'application/json' });
  const file = typeof File === 'function' ? new File([blob], name, { type: blob.type }) : null;
  // Trên iPhone: mở bảng Chia sẻ để lưu vào Tệp / gửi qua Zalo, email...
  if (file && navigator.canShare && /iPhone|iPad|iPod/.test(navigator.userAgent) && navigator.canShare({ files: [file] })) {
    navigator.share({ files: [file], title: name }).catch(() => {}); return;
  }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}
function backup() {
  const data = {};
  for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (k.startsWith(PREFIX)) data[k] = localStorage.getItem(k); }
  const out = { app: 'so-tay-hoc-ai', version: APP_VERSION, exportedAt: new Date().toISOString(), data };
  downloadFile('sotay-hoc-ai-saoluu-' + today() + '.json', JSON.stringify(out, null, 1));
  store.set('lastBackup', today());
}
function restore(text) {
  let obj; try { obj = JSON.parse(text); } catch (e) { return toast('File không hợp lệ.'); }
  if (!obj || obj.app !== 'so-tay-hoc-ai' || !obj.data) return toast('Đây không phải file sao lưu của Sổ tay học AI.');
  if (!confirm('Khôi phục sẽ GHI ĐÈ dữ liệu hiện tại trên máy này bằng dữ liệu trong file (sao lưu ngày ' + vnDate((obj.exportedAt || '').slice(0, 10)) + '). Tiếp tục?')) return;
  try {
    Object.keys(localStorage).filter(k => k.startsWith(PREFIX)).forEach(k => localStorage.removeItem(k));
    Object.keys(obj.data).forEach(k => { if (k.startsWith(PREFIX)) localStorage.setItem(k, obj.data[k]); });
  } catch (e) { return toast('Không khôi phục được: bộ nhớ đầy.'); }
  toast('Đã khôi phục ✓'); setTimeout(() => location.reload(), 600);
}

/* ---------- 10. XỬ LÝ BẤM NÚT (một chỗ cho toàn app) ---------- */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const a = el.dataset.act;
  const R = () => render();
  switch (a) {
    case 'go': location.hash = el.dataset.href; break;
    case 'copybox': copyText(el.closest('.codebox').querySelector('pre').textContent); break;
    case 'tStart': T.end = Date.now() + T.left * 1000; T.run = true; saveTimer(); markStudyDay(); R(); break;
    case 'tPause': T.left = timerLeft(); T.run = false; saveTimer(); R(); break;
    case 'tSkip': T.stage = (T.stage + 1) % 3; T.left = STAGES[T.stage].m * 60; if (T.run) T.end = Date.now() + T.left * 1000; saveTimer(); R(); break;
    case 'tReset': T = { stage: 0, left: 15 * 60, run: false, end: 0 }; saveTimer(); R(); break;
    case 'toggleDone': {
      const d = getDone(), id = el.dataset.id;
      if (d[id]) delete d[id]; else { d[id] = today(); markStudyDay(); toast('🎉 Hoàn thành buổi ' + id + '!'); }
      store.set('done', d); R(); break;
    }
    case 'ans': {
      const s = +el.dataset.s, q = +el.dataset.q, o = +el.dataset.o;
      quizState[s] = quizState[s] || {}; if (quizState[s][q] != null) break;
      quizState[s][q] = o;
      const ses = SESSIONS.find(x => x.id === s), st = quizState[s];
      if (Object.keys(st).length === ses.quiz.length) {
        const score = Math.round(ses.quiz.filter((qq, i) => st[i] === qq.c).length / ses.quiz.length * 100);
        const qz = store.get('quiz', {}); qz[s] = Math.max(qz[s] || 0, score); store.set('quiz', qz); markStudyDay();
      }
      $('quiz').innerHTML = quizHtml(ses); break;
    }
    case 'quizReset': { const s = +el.dataset.s; quizState[s] = {}; $('quiz').innerHTML = quizHtml(SESSIONS.find(x => x.id === s)); break; }
    case 'flip': flipped = !flipped; R(); break;
    case 'rate': rateCard(el.dataset.id, el.dataset.ok === '1'); flipped = false; R(); break;
    case 'gfilter': gFilter = el.dataset.g; document.querySelectorAll('#gseg button').forEach(b => b.classList.toggle('on', b === el)); $('glist').innerHTML = glossList($('gq').value, gFilter); break;
    case 'pgroup': pGroup = el.dataset.g; R(); break;
    case 'addPrompt': {
      const t = $('np_t').value.trim(), x = $('np_x').value.trim();
      if (!t || !x) { toast('Cần nhập tên và nội dung prompt.'); break; }
      const my = store.get('myPrompts', []); my.push({ id: 'm' + Date.now(), t, g: $('np_g').value.trim() || 'Của tôi', x });
      if (store.set('myPrompts', my)) { toast('Đã lưu prompt ✓'); pGroup = 'Của tôi'; R(); } break;
    }
    case 'delPrompt': if (confirm('Xóa prompt này?')) { store.set('myPrompts', store.get('myPrompts', []).filter(p => p.id !== el.dataset.id)); R(); } break;
    case 'seg': {
      $(el.dataset.target).value = el.dataset.val;
      el.parentNode.querySelectorAll('button').forEach(b => b.classList.toggle('on', b === el));
      if (el.dataset.target === 'themeSel') { store.set('theme', el.dataset.val); applyTheme(); }
      break;
    }
    case 'ck': checklist[el.dataset.k] = el.dataset.k === 'emo' ? +el.dataset.v : el.dataset.v; el.parentNode.querySelectorAll('button').forEach(b => b.classList.toggle('on', b === el)); break;
    case 'ckRun': $('ckResult').innerHTML = checklistResult(); break;
    case 'ckClear': checklist = {}; R(); break;
    case 'ckToJournal': prefill = { emo: checklist.emo, plan: 'Có', moved: 'Không' }; editingTrade = null; location.hash = '#/giao-dich/nhat-ky'; break;
    case 'saveTrade': saveTrade(); break;
    case 'cancelTrade': editingTrade = null; prefill = null; R(); break;
    case 'editTrade': editingTrade = el.dataset.id; prefill = null; R(); window.scrollTo(0, 0); break;
    case 'delTrade': if (confirm('Xóa lệnh này khỏi nhật ký?')) { store.set('trades', getTrades().filter(t => t.id !== el.dataset.id)); R(); } break;
    case 'exportAI': exportForAI(); break;
    case 'dlCsv': downloadFile('nhat-ky-giao-dich-' + today() + '.csv', '\uFEFF' + tradesCsv(getTrades()), 'text/csv'); break;
    case 'savePlan': {
      const g = id => $(id).value.trim(), n = (id, d) => { const v = num(g(id)); return v == null ? d : v; };
      const p = { capital: n('p_cap', 0), account: g('p_acc'), riskPct: n('p_risk', 1), maxTrades: Math.round(n('p_max', 3)), dayLossPct: n('p_day', 3), weekLossPct: n('p_week', 6), stopAfterLosses: Math.round(n('p_stop', 2)), minRR: n('p_rr', 1.5), pairs: g('p_pairs'), hours: g('p_hours'), rules: $('p_rules').value };
      if (p.riskPct > 2) toast('⚠️ Rủi ro trên 2%/lệnh là rất cao với người đang thua lỗ. Cân nhắc giảm về 0,5–1%.', 6000);
      if (store.set('plan', p)) toast('Đã lưu kế hoạch ✓'); break;
    }
    case 'copyPlan': copyText(planText()); break;
    case 'doSearch': location.hash = '#/tim-kiem/' + encodeURIComponent($('sq').value.trim()); break;
    case 'backup': backup(); break;
    case 'wipe':
      if (confirm('Xóa TOÀN BỘ dữ liệu (tiến độ, ghi chú, prompt riêng, nhật ký giao dịch)? Nên sao lưu trước.') && confirm('Chắc chắn xóa? Không thể hoàn tác.')) {
        Object.keys(localStorage).filter(k => k.startsWith(PREFIX)).forEach(k => localStorage.removeItem(k)); location.reload();
      } break;
    case 'theme': { const cur = document.documentElement.dataset.theme; store.set('theme', cur === 'dark' ? 'light' : 'dark'); applyTheme(); break; }
  }
});
/* Gõ chữ: ghi chú tự lưu, máy tính tự tính, từ điển tự lọc */
let noteTimer;
document.addEventListener('input', e => {
  const el = e.target;
  if (el.id === 'note') { clearTimeout(noteTimer); noteTimer = setTimeout(() => { const n = store.get('notes', {}); n[el.dataset.sid] = el.value; store.set('notes', n); }, 400); }
  else if (el.dataset.input === 'calc') calcUpdate();
  else if (el.dataset.input === 'gloss') $('glist').innerHTML = glossList(el.value, gFilter);
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.dataset.input === 'calc') calcUpdate();
  if ((el.id === 'restoreFile' || el.id === 'mt5file') && el.files && el.files[0]) {
    const rd = new FileReader();
    rd.onload = () => el.id === 'restoreFile' ? restore(rd.result) : importMt5(rd.result);
    rd.readAsText(el.files[0]); el.value = '';
  }
});
document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.id === 'sq') location.hash = '#/tim-kiem/' + encodeURIComponent(e.target.value.trim()); });

/* ---------- 11. GIAO DIỆN SÁNG / TỐI ---------- */
function applyTheme() {
  const t = store.get('theme', 'auto');
  const dark = t === 'dark' || (t === 'auto' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.dataset.theme = dark ? 'dark' : 'light';
}

/* ---------- 12. KHỞI ĐỘNG APP ---------- */
const APP_VERSION = '1.0 (Tuần 1)';
applyTheme();
render();
/* Đăng ký service worker để chạy offline (chỉ khi mở qua địa chỉ http/https, không chạy khi mở file trực tiếp) */
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}

</script>
