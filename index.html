<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">

<title>Sổ tay học AI</title>
<meta name="description" content="Học AI và lập trình vừa đủ hiểu trong 30 buổi – chạy offline">
<meta name="theme-color" content="#0b6e6e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<link rel="apple-touch-icon" href="apple-touch-icon.png">
<!-- ================= PHẦN 1: TRANG TRÍ (CSS) ================= -->
<style>
/* ================= GIAO DIỆN (CSS) ================= */
:root{
  --bg:#f4f6f8; --card:#ffffff; --text:#1d2733; --muted:#5f6b78; --line:#e1e6ec;
  --pri:#0b6e6e; --pri-2:#e3f2f1; --ok:#1e8a4c; --ok-2:#e5f5ec; --bad:#c0392b; --bad-2:#fdecea;
  --warn:#b7791f; --warn-2:#fdf4e3; --code:#f1f3f5;
  --radius:14px; --nav-h:64px;
  --font: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
[data-theme="dark"]{
  --bg:#0f1418; --card:#182027; --text:#e6edf3; --muted:#9aa7b4; --line:#2a343d;
  --pri:#4fc3b8; --pri-2:#163432; --ok:#4cc38a; --ok-2:#143323; --bad:#ff7b6b; --bad-2:#3a1c19;
  --warn:#f0b452; --warn-2:#3a2c12; --code:#11181d;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:17px;line-height:1.6;
  -webkit-text-size-adjust:100%; padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom));}
a{color:var(--pri)}
h1,h2,h3,h4{line-height:1.3;margin:1.1em 0 .5em}
h1{font-size:1.45rem} h2{font-size:1.25rem} h3{font-size:1.1rem} h4{font-size:1rem}
header.top{position:sticky;top:0;z-index:20;background:var(--card);border-bottom:1px solid var(--line);
  padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;gap:10px}
header.top .title{font-weight:700;font-size:1.05rem;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header.top button{background:none;border:none;color:var(--text);font-size:1.3rem;padding:4px 8px;cursor:pointer}
main{max-width:860px;margin:0 auto;padding:14px 14px 30px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin:0 0 14px}
.card h2:first-child,.card h3:first-child{margin-top:0}
.muted{color:var(--muted);font-size:.92rem}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:520px){.grid2{grid-template-columns:1fr}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--card);
  color:var(--text);border-radius:10px;padding:10px 14px;font-size:1rem;cursor:pointer;font-family:inherit;min-height:44px}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff}
[data-theme="dark"] .btn.pri{color:#06201e}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.bad{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.sm{padding:6px 10px;min-height:34px;font-size:.9rem}
.btn.block{width:100%}
.btn:disabled{opacity:.5}
.pill{display:inline-block;padding:2px 10px;border-radius:99px;font-size:.8rem;background:var(--pri-2);color:var(--pri);font-weight:600}
.pill.ok{background:var(--ok-2);color:var(--ok)} .pill.bad{background:var(--bad-2);color:var(--bad)} .pill.warn{background:var(--warn-2);color:var(--warn)}
.progress{height:10px;background:var(--line);border-radius:99px;overflow:hidden}
.progress>div{height:100%;background:var(--pri);border-radius:99px;transition:width .3s}
.stat{display:flex;flex-direction:column;background:var(--bg);border-radius:10px;padding:10px 12px}
.stat b{font-size:1.35rem}
.stat span{font-size:.82rem;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
/* Danh sách */
.list{list-style:none;margin:0;padding:0}
.list li{border-top:1px solid var(--line);padding:12px 4px;display:flex;gap:10px;align-items:center;cursor:pointer}
.list li:first-child{border-top:none}
.list .num{width:34px;height:34px;flex:0 0 34px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  background:var(--bg);font-weight:700;font-size:.9rem}
.list .num.done{background:var(--ok);color:#fff}
.list .grow{flex:1;min-width:0}
.list .t{font-weight:600}
/* Nội dung bài học */
.lesson p{margin:.5em 0}
.lesson table,.tbl{border-collapse:collapse;width:100%;font-size:.93rem;margin:.6em 0;display:block;overflow-x:auto}
.lesson th,.lesson td,.tbl th,.tbl td{border:1px solid var(--line);padding:7px 9px;text-align:left;vertical-align:top}
.lesson th,.tbl th{background:var(--pri-2)}
.lesson blockquote{margin:.8em 0;padding:10px 14px;border-left:4px solid var(--pri);background:var(--pri-2);border-radius:8px}
.lesson ul,.lesson ol{padding-left:1.3em}
.codebox{margin:.8em 0;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--code)}
.codebox .bar{display:flex;justify-content:space-between;align-items:center;padding:4px 6px 4px 12px;font-size:.8rem;color:var(--muted);border-bottom:1px solid var(--line)}
.codebox pre{margin:0;padding:12px;overflow-x:auto;white-space:pre-wrap;word-break:break-word;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.86rem;line-height:1.5}
/* Trắc nghiệm */
.q{margin:14px 0}
.q .opt{display:block;width:100%;text-align:left;margin:6px 0;border:1px solid var(--line);background:var(--card);color:var(--text);
  border-radius:10px;padding:10px 12px;font-size:.98rem;cursor:pointer;font-family:inherit}
.q .opt.right{background:var(--ok-2);border-color:var(--ok)}
.q .opt.wrong{background:var(--bad-2);border-color:var(--bad)}
.q .exp{font-size:.9rem;color:var(--muted);margin-top:4px}
/* Thẻ ghi nhớ */
.flash{min-height:190px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:1.15rem;
  padding:24px;border-radius:var(--radius);background:var(--pri-2);cursor:pointer;user-select:none}
.flash.back{background:var(--card);border:2px solid var(--pri);font-size:1.02rem}
/* Form */
label{display:block;font-size:.88rem;color:var(--muted);margin:8px 0 3px}
input,select,textarea{width:100%;padding:10px 11px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--text);
  font-size:16px;font-family:inherit}
textarea{min-height:90px;resize:vertical}
input[type=checkbox],input[type=radio]{width:auto}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{flex:1;border:none;background:var(--card);color:var(--text);padding:9px 6px;font-size:.95rem;cursor:pointer;font-family:inherit;border-left:1px solid var(--line)}
.seg button:first-child{border-left:none}
.seg button.on{background:var(--pri);color:#fff}
[data-theme="dark"] .seg button.on{color:#06201e}
/* Cảnh báo */
.alert{border-radius:12px;padding:14px 16px;margin:0 0 14px;border:1px solid}
.alert.bad{background:var(--bad-2);border-color:var(--bad);color:var(--text)}
.alert.ok{background:var(--ok-2);border-color:var(--ok)}
.alert.warn{background:var(--warn-2);border-color:var(--warn)}
.alert h3{margin:0 0 6px}
.stopscreen{text-align:center;padding:26px 16px}
.stopscreen .big{font-size:2.1rem;font-weight:800;color:var(--bad);letter-spacing:.5px}
/* Đồng hồ */
.timer{font-size:2.6rem;font-weight:800;font-variant-numeric:tabular-nums;text-align:center}
.stages{display:flex;gap:6px}
.stages div{flex:1;text-align:center;font-size:.8rem;padding:6px 2px;border-radius:8px;background:var(--bg);color:var(--muted)}
.stages div.on{background:var(--pri);color:#fff;font-weight:700}
/* Thanh điều hướng */
nav.bottom{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:1px solid var(--line);
  display:flex;padding-bottom:env(safe-area-inset-bottom);height:calc(var(--nav-h) + env(safe-area-inset-bottom))}
nav.bottom a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-decoration:none;color:var(--muted);font-size:.7rem;gap:2px}
nav.bottom a .i{font-size:1.35rem;line-height:1}
nav.bottom a.on{color:var(--pri);font-weight:700}
@media (min-width:1000px){
  body{padding-bottom:0;padding-left:210px}
  nav.bottom{top:0;right:auto;width:210px;height:auto;flex-direction:column;justify-content:flex-start;border-top:none;border-right:1px solid var(--line);padding-top:70px}
  nav.bottom a{flex:0 0 auto;flex-direction:row;justify-content:flex-start;gap:12px;padding:12px 20px;font-size:.98rem}
}
.toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + 20px);transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:10px;
  z-index:99;font-size:.95rem;opacity:0;transition:opacity .25s;pointer-events:none;max-width:90%}
.toast.show{opacity:.95}
.hl{background:var(--warn-2);border-radius:3px}
.tabs{display:flex;gap:6px;overflow-x:auto;margin:0 0 12px;padding-bottom:2px}
.tabs a{white-space:nowrap;text-decoration:none;padding:7px 12px;border-radius:99px;background:var(--card);border:1px solid var(--line);color:var(--text);font-size:.92rem}
.tabs a.on{background:var(--pri);border-color:var(--pri);color:#fff}
[data-theme="dark"] .tabs a.on{color:#06201e}
.trade{border-top:1px solid var(--line);padding:10px 2px}
.trade:first-child{border-top:none}
.small{font-size:.85rem}
.right{text-align:right}
hr{border:none;border-top:1px solid var(--line);margin:14px 0}

</style>
</head>

<!-- ================= PHẦN 3: DỮ LIỆU BÀI HỌC (sửa ở đây để thêm bài) ================= -->
<script id="du-lieu-bai-hoc">
/* =====================================================================
   DỮ LIỆU BÀI HỌC — SỔ TAY HỌC AI
   ---------------------------------------------------------------------
   Phần này CHỈ chứa nội dung. Muốn thêm/sửa bài học, chỉ sửa ở đây,
   không cần đụng tới phần giao diện bên dưới.

   Mỗi buổi học là một đối tượng { ... } trong mảng SESSIONS.
   Tuần 1 nằm ngay bên dưới; Tuần 2–6 được thêm bằng SESSIONS.push(...) ở các khối tiếp theo.
     id       : số thứ tự buổi (1..44)
     week     : thuộc tuần mấy (1..6; 5–6 là phần Nâng cao)
     title    : tên buổi
     goal     : mục tiêu (1 câu)
     practice : bài thực hành trên máy tính (tóm tắt 1 câu)
     practiceDetail : hướng dẫn thực hành chi tiết (markdown như content)
     ready    : true = đã có nội dung đầy đủ; false = mới có khung
     content  : nội dung bài, viết kiểu "markdown đơn giản":
                  ## Tiêu đề lớn      ### Tiêu đề nhỏ
                  - gạch đầu dòng     1. đánh số
                  > khung ghi chú
                  | bảng | có | cột |
                  **chữ đậm**
                  ~~~prompt  ... ~~~   (khối prompt, có nút Sao chép)
                  ~~~python  ... ~~~   (khối code)
     summary  : 3 dòng tóm tắt
     quiz     : [{ q: câu hỏi, a: [đáp án...], c: số thứ tự đáp án đúng (0 là đầu tiên), e: giải thích }]
     cards    : [{ f: mặt trước, b: mặt sau }]   (thẻ ghi nhớ)

   LƯU Ý: nội dung đặt giữa hai dấu ` (dấu huyền). Trong nội dung
   KHÔNG được gõ dấu ` và không gõ ký hiệu $ đứng liền dấu {.
   ===================================================================== */

const WEEKS = [
  { id: 1, title: "Tuần 1 – Hiểu AI và nói chuyện với AI", goal: "Biết AI hoạt động ra sao, hay sai ở đâu, và giao việc cho AI đúng cách." },
  { id: 2, title: "Tuần 2 – Lập trình vừa đủ hiểu", goal: "Đọc hiểu code AI viết, chạy được script Python đầu tiên, biết báo lỗi cho AI sửa." },
  { id: 3, title: "Tuần 3 – Ứng dụng chạy thế nào & tự động hóa văn phòng", goal: "Hiểu app offline, API, Agent; tự động hóa Excel/Word; bảo mật dữ liệu." },
  { id: 4, title: "Tuần 4 – AI với trading và kiếm tiền", goal: "Dùng AI để giữ kỷ luật và quản lý rủi ro; chọn hướng kiếm tiền hợp với kế toán." },
  { id: 5, adv: true, title: "Nâng cao 1 – Excel chuyên sâu & phần mềm nội bộ", goal: "Làm Excel tự động, thiết kế và làm phần mềm nội bộ nhỏ bằng AI, bảo trì an toàn." },
  { id: 6, adv: true, title: "Nâng cao 2 – Video AI, API, trading nâng cao & tự động hóa", goal: "Làm video AI nhanh hơn, gọi AI bằng code, kiểm chứng chiến lược bằng dữ liệu, tự động hóa quy trình." }
];

const SESSIONS = [
/* ============================ TUẦN 1 ============================ */
{
id: 1, week: 1, ready: true,
title: "AI là gì? Vì sao AI trả lời được",
goal: "Hiểu mô hình ngôn ngữ lớn (LLM) hoạt động bằng cách đoán chữ tiếp theo, từ đó biết AI giỏi gì và yếu gì.",
practice: "Làm 3 thí nghiệm nhỏ với AI để tự thấy điểm mạnh, điểm yếu của nó.",
content: `
## AI mà bạn đang dùng là loại nào?
"AI" là một từ rất rộng. Thứ bạn dùng hằng ngày như Claude, ChatGPT, Gemini thuộc một loại cụ thể: **mô hình ngôn ngữ lớn**, tiếng Anh là Large Language Model, viết tắt **LLM**.

"Mô hình" ở đây là một chương trình máy tính rất lớn. "Ngôn ngữ" nghĩa là nó làm việc với chữ. "Lớn" nghĩa là nó được cho đọc một lượng văn bản khổng lồ: sách, báo, trang web, tài liệu, code...

## Nó "học" như thế nào?
Hãy nghĩ đến chính bạn. Làm kế toán lâu năm, nhìn dòng đầu của một biên bản giao nhận thực phẩm là bạn đoán được gần hết các dòng sau: tên hàng, đơn vị tính, số lượng, đơn giá, thành tiền, chữ ký các bên. Bạn không cần thuộc lòng từng biên bản, vì đã nhìn đủ nhiều để nắm **quy luật**.

LLM học theo cách tương tự nhưng ở quy mô cực lớn. Trong giai đoạn **huấn luyện**, máy đọc hàng tỷ trang văn bản và liên tục tự tập: "với đoạn chữ này, chữ tiếp theo hợp lý nhất là gì?". Đoán sai thì tự chỉnh lại. Lặp đi lặp lại vô số lần, nó nắm được quy luật của ngôn ngữ, cách lập luận, cách viết code, cả văn phong hành chính.

## Nó "trả lời" như thế nào?
Đây là điểm quan trọng nhất của cả khóa học:

> AI **không tra cứu** câu trả lời trong một cuốn sổ như Excel tra bảng. Nó **viết ra từng mẩu chữ một**, mỗi lần chọn mẩu hợp lý nhất dựa trên toàn bộ những gì đã có phía trước.

Ví dụ bạn gõ: "Biên bản giao nhận thực ..." thì mẩu chữ tiếp theo hợp lý nhất là "phẩm". Cứ thế nối dài thành câu, thành đoạn, thành cả văn bản.

## Hệ quả: AI giỏi gì, yếu gì?
| Giỏi | Yếu |
| Viết, sửa văn, tóm tắt, đổi giọng văn | Con số cần chính xác tuyệt đối (khi không cho nó dùng công cụ tính) |
| Giải thích khái niệm khó cho dễ hiểu | Thông tin mới xảy ra sau thời điểm nó được huấn luyện |
| Viết code, công thức Excel | Số hiệu văn bản, điều khoản, tên người cụ thể nó không chắc |
| Chuyển định dạng: bảng → văn bản, văn bản → bảng | Biết "hôm nay" là ngày nào nếu không được cho biết |
| Gợi ý ý tưởng, lập dàn ý | Dự đoán tương lai (ví dụ giá vàng ngày mai) |

Vì AI luôn cố viết ra câu "nghe hợp lý", khi không biết nó vẫn có thể viết rất trơn tru, gọi là **"bịa"**. Buổi 3 sẽ học kỹ cách phát hiện và phòng tránh.

## Phép so sánh dễ nhớ
> Hãy coi AI như **một nhân viên mới cực kỳ chăm đọc**: viết nhanh, biết nhiều, nhưng không có sổ sách của cơ quan bạn, không biết hôm nay ngày mấy nếu bạn không nói, và rất ngại trả lời "tôi không biết". Giao việc phải rõ ràng, và **luôn kiểm tra** trước khi ký.

## AI có "công cụ" thì khác
Ngày nay nhiều trợ lý AI được trang bị công cụ: tìm kiếm web, chạy code, đọc file Excel/PDF, tạo file. Khi có công cụ, AI có thể **tính bằng code** thay vì "đoán" con số, và **tra web** thay vì dựa vào trí nhớ cũ.

Bài học thực tế cho kế toán: khi cần số liệu chính xác, hãy yêu cầu rõ: "Hãy dùng code (hoặc công thức Excel) để tính, không tính nhẩm."

## Vì sao cần hiểu điều này?
Mọi kỹ năng ở các buổi sau (viết prompt, kiểm soát AI, nhờ AI làm app, dùng AI trong trading) đều dựa trên một ý: **AI là cỗ máy viết chữ hợp lý, không phải cỗ máy biết sự thật.** Bạn là người cầm lái và chịu trách nhiệm cuối cùng.
`,
summary: [
  "LLM học quy luật ngôn ngữ từ lượng văn bản khổng lồ, rồi trả lời bằng cách viết từng mẩu chữ hợp lý nhất.",
  "AI giỏi viết, giải thích, viết code; yếu về con số chính xác, thông tin mới và chi tiết cụ thể nó không chắc.",
  "Coi AI như nhân viên mới chăm đọc: giao việc rõ, cho dùng công cụ khi cần chính xác, luôn kiểm tra kết quả."
],
practiceDetail: `
### Thí nghiệm 1 – AI có biết hôm nay ngày mấy?
Mở một cuộc trò chuyện mới, gõ:
~~~prompt

practice: "Thử nghiệm AI quên giữa các cuộc trò chuyện và kiểm tra AI với một quy định mới.",
content: `
## Token – đơn vị "đếm chữ" của AI
AI không đọc chữ như người. Nó cắt văn bản thành những mẩu nhỏ gọi là **token**. Một token có thể là một từ, một phần của từ, hoặc dấu câu.

- Tiếng Việt có dấu thường bị cắt thành **nhiều token hơn** tiếng Anh cho cùng một ý.
- Giới hạn sử dụng của các gói AI (miễn phí hay trả phí) thường được tính theo token.
- Dán một file dài vào = tiêu tốn nhiều token.

Bạn không cần đếm token. Chỉ cần nhớ: **càng dài càng tốn**, và mọi thứ đều có giới hạn.

## Cửa sổ ngữ cảnh – "cái bàn làm việc" của AI
Hãy tưởng tượng AI ngồi ở một cái bàn. Mọi thứ trong cuộc trò chuyện (câu bạn hỏi, câu nó trả lời, file bạn dán vào) đều được bày lên bàn. Mỗi lần trả lời, AI nhìn lại **toàn bộ mặt bàn**.

Cái bàn này gọi là **cửa sổ ngữ cảnh** (context window). Nó rất rộng nhưng **có giới hạn**. Khi cuộc trò chuyện quá dài:
- Phần đầu có thể bị tóm tắt lại hoặc bị đẩy khỏi bàn → AI "quên" yêu cầu ban đầu.
- AI dễ lẫn lộn giữa các phiên bản (ví dụ biên bản tháng 9 và tháng 10).
- Trả lời chậm hơn, tốn lượt dùng hơn.

### Mẹo dùng bàn làm việc hiệu quả
1. **Mỗi việc một cuộc trò chuyện mới.** Làm biên bản thì mở chat riêng, hỏi trading thì mở chat riêng.
2. Khi chat đã quá dài, nhờ AI: "Tóm tắt các quyết định quan trọng của cuộc trò chuyện này trong 10 dòng", rồi dán bản tóm tắt sang chat mới.
3. Đưa tài liệu nền vào **Project** (dự án) để không phải dán lại mỗi lần (học kỹ ở buổi 6).

## AI có nhớ bạn không?
Mặc định: **mỗi cuộc trò chuyện là một tờ giấy trắng.** Chat hôm qua AI không thấy được ở chat hôm nay, trừ khi:
- Bạn dùng tính năng **bộ nhớ** (memory): AI tự ghi lại vài điều về bạn để dùng lại.
- Bạn làm việc trong cùng một **Project** có tài liệu và hướng dẫn chung.

Vì vậy nếu AI "quên" bạn là kế toán hay quên cách bạn muốn trình bày, đó không phải lỗi; bạn cần đưa thông tin đó vào bộ nhớ hoặc Project.

## Giới hạn kiến thức (knowledge cutoff)
AI được huấn luyện đến một thời điểm nhất định rồi dừng. Những gì xảy ra **sau** thời điểm đó, nó không biết, trừ khi được tìm web hoặc bạn dán tài liệu vào.

Ví dụ thực tế: một thông tư, nghị định mới ban hành có thể nằm ngoài kiến thức của AI. Nếu bạn hỏi, nó có thể trả lời theo **quy định cũ** một cách rất tự tin.

> Quy tắc: Với quy định pháp luật, giá cả, tỷ giá, tin tức, hãy **bật tìm kiếm web** và yêu cầu nêu nguồn, hoặc **dán văn bản gốc** vào và bảo AI chỉ trả lời dựa trên văn bản đó.

## Tóm lại bằng hình ảnh
| Khái niệm | Hình ảnh dễ nhớ | Việc bạn cần làm |
| Token | Mẩu chữ, đơn vị tính tiền/lượt | Đừng dán thừa, chỉ đưa phần cần thiết |
| Cửa sổ ngữ cảnh | Cái bàn làm việc có giới hạn | Mỗi việc một chat; chat dài thì tóm tắt sang chat mới |
| Bộ nhớ / Project | Sổ tay ghi chú về bạn / tủ hồ sơ chung | Lưu thông tin cố định một lần, dùng nhiều lần |
| Giới hạn kiến thức | Người đi xa lâu ngày mới về | Cho tìm web hoặc dán văn bản mới vào |
`,

content: `
## "Bịa" (hallucination) là gì?
Là khi AI đưa ra thông tin **sai nhưng trình bày rất tự tin**, câu chữ trơn tru như thật. Tiếng Anh gọi là hallucination (ảo giác).

Những thứ AI hay bịa nhất:
- **Số hiệu văn bản, điều, khoản**: ví dụ "Theo khoản 3 Điều 12 Thông tư số ..." nhưng điều khoản đó không tồn tại hoặc nói chuyện khác.
- **Con số, tỷ lệ, thống kê** không có nguồn.
- **Tên người, chức vụ, tên đơn vị.**
- **Trích dẫn** câu nói, bài báo.
- **Hàm Excel, thư viện lập trình** không có thật.
- **Đường link** dẫn tới trang không tồn tại.

## Vì sao AI bịa?
Nhớ lại buổi 1: AI viết chữ **hợp lý nhất**, không phải chữ **đúng nhất**. Một số hiệu văn bản có hình thức "xx/2025/TT-BCA" trông rất hợp lý, nên AI có thể viết ra dù không có văn bản đó.

## Dấu hiệu cảnh báo
- Có số liệu, số hiệu rất cụ thể nhưng **không có nguồn**.
- Hỏi lại cùng câu, **mỗi lần ra một đáp án khác**.
- Câu trả lời **quá đúng ý bạn**, không có chỗ nào "không chắc".
- Bạn hỏi "nguồn ở đâu?" thì AI **xin lỗi và đổi đáp án**.

## 6 cách kiểm tra
1. **Yêu cầu nêu nguồn, rồi tự mở nguồn.** Không mở được nguồn = chưa được dùng.
2. **Dán văn bản gốc vào** và ra lệnh: chỉ trả lời dựa trên văn bản này.
3. **Cho phép AI nói "không biết"**: "Nếu không chắc chắn, hãy ghi Không chắc chắn, đừng đoán."
4. **Con số thì tính bằng code hoặc Excel**, không tin số tính nhẩm.
5. **Hỏi lại theo cách khác**, hoặc hỏi một công cụ AI thứ hai để đối chiếu.
6. **Tự đối chiếu trước khi ký, nộp, gửi.** Người ký là bạn, không phải AI.

## Mẫu prompt "chống bịa" dùng hằng ngày
~~~prompt
Chỉ dựa trên văn bản tôi dán bên dưới để trả lời. Quy tắc:
- Mỗi ý trả lời phải ghi rõ lấy từ điều/khoản/đoạn nào của văn bản.
- Nếu văn bản không đề cập, ghi đúng câu: "Văn bản không đề cập".
- Không dùng kiến thức bên ngoài, không suy đoán.

Câu hỏi: [câu hỏi của bạn]

Văn bản:
[dán văn bản vào đây]
~~~

## Áp dụng vào công việc kế toán
> Quy tắc vàng: **Con số và căn cứ pháp lý luôn phải kiểm tra.** AI được dùng để soạn nhanh, sắp xếp, gợi ý; còn số tiền, định mức, số hiệu văn bản thì bạn đối chiếu với chứng từ và văn bản gốc.

## Áp dụng vào trading
Nếu AI nói "vàng tuần sau khả năng cao sẽ tăng", đó chỉ là **một đoạn chữ nghe hợp lý**, không phải dự báo có cơ sở. AI không biết tương lai. Ở Tuần 4 bạn sẽ học cách dùng AI đúng chỗ trong trading: phân tích **chính bạn** (nhật ký, kỷ luật), không phải đoán giá.
`,

## Các nhóm công cụ AI
> Lưu ý: tên gói, tính năng và giá của các công cụ AI **thay đổi rất nhanh**. Thông tin dưới đây là khung để hiểu; giá và tính năng cụ thể **cần kiểm tra lại** trên trang chính thức.

| Nhóm | Ví dụ | Dùng để |
| Trợ lý trò chuyện | Claude (Anthropic), ChatGPT (OpenAI), Gemini (Google), Copilot (Microsoft) | Hỏi đáp, soạn văn bản, phân tích file, viết code |
| AI trong công cụ văn phòng | AI tích hợp trong Word/Excel/Google Docs/Sheets | Làm việc ngay trong file đang mở |
| AI lập trình | Các công cụ viết code tự động (ví dụ Claude Code) | Làm app, script tự động hóa |
| AI tạo ảnh, video, giọng nói | Các công cụ tạo ảnh/video | Thiết kế, video tuyên truyền |
| AI tìm kiếm | Trợ lý có tìm web và trích nguồn | Tra cứu thông tin mới |

## Tiêu chí chọn công cụ cho bạn
1. **Tiếng Việt tốt**: hiểu đúng ý, viết văn hành chính tự nhiên.
2. **Đọc được file**: Excel, Word, PDF bạn đưa vào.
3. **Chạy code / tạo file**: tính toán chính xác, xuất file Excel/Word.
4. **Tìm web có nguồn**: cho thông tin mới.
5. **Bảo mật**: có cài đặt không dùng dữ liệu của bạn để huấn luyện hay không; chính sách lưu trữ.
6. **Giá và giới hạn**: bản miễn phí thường giới hạn số lượt và model yếu hơn.

## Miễn phí hay trả phí?
- **Miễn phí**: đủ để học và làm việc nhẹ. Hay bị giới hạn lượt, file, tính năng.
- **Trả phí**: model mạnh hơn, nhiều lượt hơn, có Project, đọc file lớn, chạy code.
- Nguyên tắc: **dùng miễn phí đến khi thấy rõ mình bị giới hạn ở đâu**, rồi mới trả phí cho đúng thứ cần.

## Lời khuyên: 1 chính, 1 phụ
- Chọn **1 công cụ chính** và học dùng thật thành thạo (Project, bộ nhớ, đọc file, chạy code). Thành thạo một công cụ giá trị hơn biết sơ sơ năm công cụ.
- Giữ **1 công cụ phụ** để đối chiếu khi gặp câu trả lời quan trọng hoặc đáng ngờ.

## Bảo mật khi chọn công cụ
Dù dùng công cụ nào, **không đưa lên AI**: thông tin mật của cơ quan, dữ liệu cá nhân người cai nghiện (họ tên, ngày sinh, hồ sơ), văn bản nội bộ chưa công khai, số tài khoản, mật khẩu. Buổi 20 sẽ học cách **ẩn danh hóa** dữ liệu trước khi nhờ AI.

{
id: 5, week: 1, ready: true,
title: "Viết prompt 5 phần: Vai trò – Bối cảnh – Nhiệm vụ – Ràng buộc – Định dạng",
goal: "Viết được prompt rõ ràng theo công thức 5 phần, biết đưa ví dụ mẫu và chia nhỏ việc.",
practice: "Viết lại 3 prompt 'xấu' thành prompt tốt và so sánh kết quả.",
content: `
## Prompt là gì?
**Prompt** là câu lệnh, yêu cầu bạn gửi cho AI. Chất lượng câu trả lời phụ thuộc rất lớn vào chất lượng prompt. Giống như giao việc cho nhân viên mới: giao mơ hồ thì nhận về kết quả mơ hồ.

## Công thức 5 phần (nhớ: V-B-N-R-Đ)
| Phần | Trả lời câu hỏi | Ví dụ |
| **V**ai trò | AI nên đóng vai ai? | "Bạn là kế toán đơn vị sự nghiệp công lập có 15 năm kinh nghiệm." |
| **B**ối cảnh | Tình huống, đối tượng, dữ liệu sẵn có? | "Tôi làm ở cơ sở cai nghiện, phụ trách nuôi ăn. Đây là số liệu tháng 10..." |
| **N**hiệm vụ | Cụ thể cần làm gì? | "Lập biên bản giao nhận thực phẩm ngày 15/10." |
| **R**àng buộc | Giới hạn, điều cấm, tiêu chuẩn? | "Dùng thuật ngữ 'người cai nghiện'. Không tự thêm số liệu. Tối đa 1 trang." |
| **Đ**ịnh dạng | Kết quả trình bày ra sao? | "Dạng bảng, có dòng tổng cộng, số tiền ghi bằng chữ." |

Không phải lúc nào cũng cần đủ 5 phần. Việc đơn giản chỉ cần Nhiệm vụ + Định dạng. Việc quan trọng thì dùng đủ.

## So sánh prompt xấu và prompt tốt
### Ví dụ 1 – Văn bản
| Xấu | Tốt |
| "Viết biên bản giao nhận." | "Bạn là kế toán cơ sở cai nghiện. Lập biên bản giao nhận thực phẩm ngày 15/10/2026 giữa nhà cung cấp và bộ phận bếp, gồm 3 mặt hàng tôi liệt kê bên dưới. Có phần thành phần tham dự, bảng hàng hóa (tên, ĐVT, số lượng, đơn giá, thành tiền), tổng tiền bằng số và chữ, phần ký của 3 bên. Không tự thêm mặt hàng." |

### Ví dụ 2 – Excel
| Xấu | Tốt |
| "Công thức Excel tính tổng." | "Trong Excel, cột A là Ngày, cột B là Tên hàng, cột F là Thành tiền (dòng 2 đến 500). Viết công thức tính tổng Thành tiền của 'Gạo' trong tháng 10/2026. Giải thích từng phần công thức bằng tiếng Việt đơn giản." |

### Ví dụ 3 – Trading
| Xấu | Tốt |
| "Vàng có nên mua không?" | "Đóng vai người giám sát kỷ luật giao dịch. Đây là kế hoạch giao dịch của tôi và lệnh tôi định vào. Hãy kiểm tra lệnh này có vi phạm điều nào trong kế hoạch không. Không đưa ý kiến mua hay bán." |

## 3 kỹ thuật nâng cao dễ dùng
### 1. Đưa ví dụ mẫu
AI bắt chước rất giỏi. Thay vì mô tả dài, **dán một mẫu bạn đã làm đúng** và nói: "Làm theo đúng mẫu này cho tháng 11."

### 2. Chia nhỏ việc
Việc lớn chia thành bước: "Bước 1: lập dàn ý. Chờ tôi duyệt rồi mới viết chi tiết." Mỗi bước kiểm tra một lần, sai thì sửa sớm.

### 3. Sửa từng phần, không làm lại từ đầu
Kết quả gần đúng thì góp ý cụ thể: "Giữ nguyên tất cả, chỉ sửa mục 3: thay 'học viên' bằng 'người cai nghiện' và rút gọn còn 5 dòng." Góp ý càng cụ thể, AI sửa càng trúng.

## Mẫu khung prompt để dùng lại
~~~prompt
VAI TRÒ: Bạn là [chuyên gia gì].
BỐI CẢNH: [Tôi là ai, đang làm gì, dữ liệu có sẵn].
NHIỆM VỤ: [Việc cụ thể cần làm].
RÀNG BUỘC:
- [Điều bắt buộc]
- [Điều cấm]
- Nếu thiếu thông tin, hỏi tôi tối đa 3 câu trước khi làm.
ĐỊNH DẠNG: [Bảng / văn bản / gạch đầu dòng, độ dài, ngôn ngữ].
~~~
`,

{

title: "Kiểm soát AI làm đúng ý mình",
goal: "Dùng hướng dẫn cố định (master prompt), Project, bộ nhớ, skill; bắt AI hỏi lại, lập kế hoạch và tự kiểm tra.",
practice: "Viết master prompt cho công việc kế toán của bạn và tạo một Project dùng nó.",
content: `
## Từ "hỏi đáp" sang "điều khiển"
Ở buổi 5 bạn học viết từng prompt. Buổi này học cách **dựng khuôn** để AI lần nào cũng làm theo ý bạn mà không phải dặn lại.

## 4 công cụ kiểm soát
| Công cụ | Giống như | Dùng khi |
| **Master prompt / hướng dẫn cố định** | Bản quy chế làm việc giao cho nhân viên | Muốn AI luôn theo một cách làm (ví dụ: luôn viết câu lệnh trước, chờ lệnh mới làm) |
| **Project (dự án)** | Tủ hồ sơ + quy chế riêng cho từng mảng việc | Một mảng việc lặp lại: nuôi ăn, chấm công, học AI |
| **Bộ nhớ (memory)** | Sổ tay AI ghi về bạn | Thông tin cố định: bạn là ai, thuật ngữ đúng, cách trình bày ưa thích |
| **Skill (kỹ năng)** | Quy trình mẫu đóng gói sẵn | Việc có quy trình chuẩn: soạn văn bản theo thể thức, làm phim... |

> Bạn đã dùng cả 4 thứ này rồi! Chính cách bạn yêu cầu AI "viết câu lệnh trước, khi tôi gõ HÃY THỰC THI PROMPT NÀY mới làm" là một **master prompt** đặt trong **Project**. App bạn đang học được tạo ra theo đúng quy trình đó.

Tên gọi và cách bật các tính năng này khác nhau giữa các công cụ AI, cần xem hướng dẫn của công cụ bạn dùng.

## 5 câu lệnh kiểm soát nên thuộc lòng
### 1. Bắt AI hỏi lại trước khi làm
~~~prompt
Trước khi làm, hãy hỏi tôi tối đa 3 câu để làm rõ yêu cầu. Chỉ bắt đầu khi tôi trả lời.
~~~
### 2. Bắt AI lập kế hoạch, chờ duyệt
~~~prompt
Đừng làm ngay. Liệt kê các bước bạn định làm và kết quả mỗi bước. Chờ tôi gõ "Duyệt" rồi mới làm.
~~~
### 3. Khóa phạm vi
~~~prompt
Chỉ sửa đúng phần tôi chỉ định. Giữ nguyên toàn bộ phần còn lại, kể cả định dạng.
~~~
### 4. Bắt AI tự kiểm tra
~~~prompt
Trước khi gửi kết quả, hãy tự rà lại theo danh sách sau và sửa lỗi:
1. Tổng tiền có khớp tổng các dòng không?
2. Có dùng từ "học viên" không? (phải là "người cai nghiện")
3. Có số liệu nào tôi không cung cấp mà bạn tự thêm không?
Ghi rõ kết quả rà soát ở cuối.
~~~
### 5. Bắt AI nói rõ chỗ không chắc
~~~prompt
Đánh dấu [CẦN KIỂM TRA] ở bất kỳ chỗ nào bạn không chắc chắn 100%.
~~~

## Vòng lặp làm việc với AI
1. **Giao việc** bằng prompt 5 phần (+ câu kiểm soát).
2. **Xem** kết quả, đối chiếu.
3. **Góp ý cụ thể** từng phần.
4. **Lưu lại** prompt tốt vào thư viện (mục Prompt trong app) hoặc vào Project.
Lần sau chỉ việc lấy ra dùng. Làm vài lần, bạn có cả bộ "công thức" riêng: đó chính là tài sản để làm nhanh hơn và để **kiếm tiền** sau này.

## Giới hạn của sự kiểm soát
- AI vẫn có thể bỏ sót một quy tắc, nhất là khi danh sách quá dài. Quy tắc quan trọng nên đặt **ở đầu và nhắc lại ở cuối**.
- Không có câu lệnh nào thay thế được **bước bạn tự kiểm tra**.

## Vì sao kế toán học lập trình dễ hơn bạn nghĩ?
Bạn đã "lập trình" hằng ngày trong Excel: đặt số vào ô, viết công thức =C2*D2, kéo công thức xuống cả cột. Lập trình chỉ là viết những việc đó **bằng chữ**, để máy làm tự động và lặp lại.

Mục tiêu tuần này **không phải tự viết code giỏi**. Mục tiêu là **đọc hiểu** code AI viết, biết nó đang làm gì, và nói đúng cho AI sửa.

## Biến = ô Excel có tên
~~~python
so_luong = 25          # 25 kg
don_gia = 18000        # 18.000 đồng/kg
thanh_tien = so_luong * don_gia
print(thanh_tien)      # in ra: 450000
~~~
- **so_luong**, **don_gia**, **thanh_tien** là **biến**: giống ô C2, D2, E2 nhưng có tên dễ hiểu.
- Dấu **=** nghĩa là "cất giá trị vào ô", không phải "bằng nhau" như toán.
- Chữ sau dấu **#** là **chú thích**, máy bỏ qua; dùng để giải thích cho người đọc.
- **print()** là lệnh in kết quả ra màn hình.

## Bạn đã biết if từ Excel
Excel: =IF(E2>1000000, "Vượt", "Đạt")
Python viết cùng ý như sau:

thanh_tien = 1250000

## 3 quy tắc đọc if trong Python
1. Sau điều kiện có dấu **hai chấm**.
2. Các dòng "thì làm gì" được **thụt vào** (4 dấu cách). Thụt vào là cách Python biết dòng đó thuộc về if. Thụt sai là lỗi, rất hay gặp.
3. **else** là "ngược lại"; **elif** là "ngược lại nếu…" (nhiều mức).

## Nhiều mức: elif
~~~python
ty_le = 1.08   # thực chi / định mức
if ty_le > 1.05:
    print("Vượt định mức trên 5%, cần giải trình")
elif ty_le > 1:
    print("Vượt nhẹ, theo dõi")
else:
    print("Trong định mức")
~~~
## Các phép so sánh
| Ký hiệu | Nghĩa |
| == | bằng (hai dấu bằng!) |
| != | khác |
| > , < , >= , <= | lớn hơn, nhỏ hơn, lớn hơn hoặc bằng, nhỏ hơn hoặc bằng |
| and | và (cả hai đúng) |
| or | hoặc (một trong hai đúng) |
| in | có nằm trong danh sách không |

~~~python
ma = "XAUUSD"
ma_duoc_phep = ["XAUUSD", "EURUSD"]
cam_xuc = 4
if ma in ma_duoc_phep and cam_xuc <= 3:
    print("Được xét vào lệnh")
else:
    print("KHÔNG vào lệnh")
~~~
Đoạn trên chính là một phần logic của **Bảng kiểm trước khi vào lệnh** trong app này.

## Hàm = công thức tự đặt tên
Excel có sẵn hàm SUM, IF, VLOOKUP: bạn đưa **đầu vào**, hàm trả **kết quả**. Trong code bạn tự tạo hàm của riêng mình.
~~~python
def thanh_tien(so_luong, don_gia):
    return so_luong * don_gia

print(thanh_tien(25, 18000))   # 450000
print(thanh_tien(50, 15000))   # 750000
~~~
- **def** = định nghĩa hàm. **thanh_tien** là tên hàm.
- **so_luong, don_gia** là **tham số** (đầu vào), giống đối số của hàm Excel.
- **return** = trả kết quả ra ngoài.

## Ví dụ có ích ngay: tính khối lượng lệnh
~~~python
def khoi_luong_lenh(von, phan_tram_rui_ro, khoang_sl_pip, gia_tri_pip_1lot=10):
    tien_rui_ro = von * phan_tram_rui_ro / 100
    lo_moi_lot = khoang_sl_pip * gia_tri_pip_1lot
    lot = tien_rui_ro / lo_moi_lot
    return int(lot * 100) / 100      # làm tròn XUỐNG 2 chữ số

print(khoi_luong_lenh(1000, 1, 20))   # 0.05
~~~
**gia_tri_pip_1lot=10** là **giá trị mặc định**: không truyền vào thì tự lấy 10. Đây chính là công thức của "Máy tính khối lượng lệnh" trong app (phần JavaScript cũng viết y hệt ý này).

## Bản đồ Tuần 2

## Bài đọc tổng hợp
Đọc script dưới đây và tự trả lời: nó làm gì, từng phần ứng với khái niệm nào.
~~~python
def doc_lenh(du_lieu_tho):
    ds = []
    for dong in du_lieu_tho:
        lai_lo = float(dong["lai_lo"])           # đổi chữ sang số
        ds.append({"ma": dong["ma"], "lai_lo": lai_lo, "cam_xuc": int(dong["cam_xuc"])})
    return ds

def thong_ke(ds):
    thang = [x for x in ds if x["lai_lo"] > 0]
    nong = [x for x in ds if x["cam_xuc"] >= 4]
    return {
        "so_lenh": len(ds),
        "ty_le_thang": round(len(thang) / len(ds) * 100, 1) if ds else 0,
        "lai_lo_khi_nong": sum(x["lai_lo"] for x in nong),
    }

du_lieu_tho = [
    {"ma": "XAUUSD", "lai_lo": "-12.5", "cam_xuc": "4"},
    {"ma": "EURUSD", "lai_lo": "20", "cam_xuc": "2"},
    {"ma": "XAUUSD", "lai_lo": "-30", "cam_xuc": "5"},
]
print(thong_ke(doc_lenh(du_lieu_tho)))
~~~
Gợi ý: dòng **[x for x in ds if …]** là cách viết gọn của "vòng lặp + if + thêm vào danh sách". AI hay viết kiểu này; giờ bạn đọc được nó.

content: `
## PWA là gì?
**PWA** (Progressive Web App) là trang web có thể **cài lên màn hình chính** và **chạy offline** giống app thật. Không cần lên App Store, không cần tài khoản lập trình viên. App Sổ tay cai nghiện, Sổ tay HSK và app này đều là PWA.

PWA cần 3 thứ:
| File | Vai trò | Giống như |
| index.html | Nội dung và xử lý | Cuốn sổ |
| manifest.webmanifest | Tên app, biểu tượng, màu, cách mở toàn màn hình | Bìa sổ và nhãn tên |
| sw.js (service worker) | Lưu sẵn các file để mở khi mất mạng | Người thủ kho giữ một bản sao |

## Service worker hoạt động thế nào?
1. Lần đầu mở app (có mạng): service worker tải và **cất vào kho** (cache) toàn bộ file.
2. Lần sau: có mạng thì lấy bản mới nhất và cập nhật kho; **mất mạng thì lấy từ kho**.
3. Khi bạn sửa app: đổi số phiên bản trong sw.js (v1 → v2) để máy biết cần thay kho mới.

Service worker chỉ chạy khi app được mở qua địa chỉ **http/https** (đưa lên web). Mở file trực tiếp trên máy tính vẫn dùng được, chỉ là không có phần cài đặt offline.

## localStorage – dữ liệu của bạn nằm ở đâu?
Tiến độ học, ghi chú, nhật ký giao dịch được lưu bằng **localStorage**: một ngăn kéo nhỏ **bên trong trình duyệt của từng máy**.
- **Không gửi lên mạng** → riêng tư.
- **Mỗi máy, mỗi trình duyệt một ngăn kéo riêng** → iPhone và Windows không tự đồng bộ. Đó là lý do có nút Sao lưu/Khôi phục.
- **Xóa dữ liệu trình duyệt / xóa app là mất** → phải sao lưu định kỳ.
- Dung lượng có hạn (thường vài MB) → đủ cho chữ, không hợp để lưu ảnh, video.

Trong app, mọi mục lưu đều có tên bắt đầu bằng "sthai.", ví dụ sthai.done (buổi đã học), sthai.notes (ghi chú), sthai.trades (nhật ký). Sao lưu = gom tất cả mục "sthai." vào một file JSON.

## JSON – định dạng của file sao lưu
~~~json
{
  "sthai.done": {"1": "2026-11-17", "2": "2026-11-18"},
  "sthai.plan": {"capital": 1000, "riskPct": 1, "maxTrades": 3}
}
~~~
JSON giống từ điển Python: các cặp "tên": giá trị. Người đọc được, máy đọc được.

## Khi nào PWA là lựa chọn tốt cho phần mềm nội bộ?
| Hợp | Không hợp |
| Một người hoặc vài người dùng, mỗi người dữ liệu riêng | Nhiều người cùng sửa một dữ liệu chung theo thời gian thực |
| Cần chạy offline, không muốn đưa dữ liệu lên mạng | Cần phân quyền, nhật ký ai sửa gì |
| Sổ tay, tra cứu, công cụ tính, checklist | Dữ liệu lớn hàng trăm nghìn dòng |
Phần nâng cao (buổi 34–37) sẽ học cách chọn kiểu phần mềm phù hợp.

content: `
## API – cửa giao dịch giữa các phần mềm
Hãy nghĩ tới **quầy giao dịch kho bạc**: bạn không vào kho tự lấy tiền; bạn nộp **mẫu giấy đúng quy định** ở quầy, quầy xử lý và trả kết quả.

**API** (giao diện lập trình ứng dụng) là "quầy giao dịch" mà một phần mềm mở ra để phần mềm khác gửi yêu cầu theo mẫu quy định.
| Ví dụ | Ai gọi | Gọi tới | Nhận về |
| Xem tỷ giá trong app ngân hàng | App | API của ngân hàng | Bảng tỷ giá |
| Đăng nhập bằng tài khoản Google | Trang web | API của Google | "Người này là ai" |
| Gọi AI từ Python | Script của bạn | API của Claude/ChatGPT | Câu trả lời của AI |

## Gọi AI qua API khác gì chat?
- **Chat**: bạn gõ, AI trả lời, từng câu một, bằng tay.
- **API**: script của bạn gửi hàng loạt yêu cầu tự động. Ví dụ: "Tóm tắt 200 văn bản trong thư mục này" chạy một lần.
- API **tính tiền theo lượng sử dụng** (số token). Cần **khóa API** (API key), giống mật khẩu. Lộ khóa thì người khác dùng và bạn trả tiền.
Buổi 41 (nâng cao) sẽ thực hành gọi AI bằng Python.

## AI Agent – AI tự làm nhiều bước
**Chatbot** trả lời một câu. **Agent** nhận một **mục tiêu**, rồi tự **lập kế hoạch**, **dùng công cụ** (tìm web, đọc file, chạy code, tạo file), **xem kết quả**, và **làm tiếp** cho đến khi xong.

Ví dụ thực tế bạn đã thấy: khi nhờ làm app này, AI đã tự tìm thông tin pháp lý trên web, viết code, chạy thử trên trình duyệt, sửa lỗi, đóng gói file. Đó là một agent.

### Vòng lặp của Agent
1. **Hiểu mục tiêu** → 2. **Lập kế hoạch** → 3. **Dùng công cụ** → 4. **Xem kết quả** → 5. **Đánh giá: xong chưa?** → chưa thì quay lại bước 2.

## Giao việc cho Agent: rủi ro và cách kiểm soát
| Rủi ro | Cách kiểm soát |
| Làm sai hướng nhưng làm rất nhiều | Bắt lập kế hoạch, chờ duyệt (buổi 6) |
| Đụng vào dữ liệu thật, ghi đè file | Chỉ cho làm trên bản sao; không cấp quyền thư mục quan trọng |
| Gửi đi, xóa, thanh toán | Không giao những việc không hoàn tác được; nếu có, bắt hỏi xác nhận |
| Đọc phải nội dung độc hại trên web | Không cho agent làm theo chỉ dẫn trong tài liệu lạ |
| Lộ dữ liệu nhạy cảm | Không đưa dữ liệu mật, dữ liệu cá nhân |

## Việc nào hợp để giao cho Agent?
- Nhiều bước nhưng **kết quả kiểm tra được**: tổng hợp file, làm báo cáo nháp, viết và chạy thử script, nghiên cứu một chủ đề có trích nguồn.
- **Không** hợp: quyết định thay bạn, ký duyệt, giao dịch tiền, gửi văn bản chính thức.
`,

Thường dùng cả hai: pandas để **tính**, openpyxl để **điền vào mẫu đẹp**.

## Đọc Excel bằng pandas
~~~python
import pandas as pd

df = pd.read_excel("dat_hang_thang_11.xlsx", sheet_name="15")   # đọc sheet tên "15"
print(df.head())             # xem 5 dòng đầu
print(df.columns.tolist())   # xem tên các cột
~~~
**df** (DataFrame) là một bảng trong bộ nhớ, giống một sheet Excel.

## Tính toán như Excel nhưng cho cả bảng
~~~python
df["Thành tiền"] = df["Số lượng"] * df["Đơn giá"]          # thêm cột, như =C2*D2 kéo xuống
tong = df["Thành tiền"].sum()                               # như SUM
theo_hang = df.groupby("Tên hàng")["Số lượng"].sum()        # như PivotTable
~~~
## Đọc cả 31 sheet ngày và gộp lại
~~~python
cac_sheet = pd.read_excel("dat_hang_thang_11.xlsx", sheet_name=None)  # None = đọc tất cả sheet
ds = []
for ten_sheet, bang in cac_sheet.items():
    bang["Ngày"] = ten_sheet
    ds.append(bang)
ca_thang = pd.concat(ds)                  # nối các bảng lại thành một
bang_ke_thang = ca_thang.groupby("Tên hàng")[["Số lượng", "Thành tiền"]].sum()
bang_ke_thang.to_excel("bang_ke_thang_11.xlsx")
~~~
Đây là "xương sống" của các script tổng hợp như tao_bien_ban.py: **đọc → gộp → nhóm → ghi**.

## Điền vào mẫu có sẵn bằng openpyxl

from openpyxl import load_workbook

    dong += 1

~~~

## Ý tưởng: "Mail merge" bằng code
Bạn có **một mẫu văn bản** và **một bảng dữ liệu**; mỗi dòng dữ liệu sinh ra một văn bản. Word có sẵn tính năng Mail Merge, nhưng code linh hoạt hơn: tạo bảng có số dòng thay đổi, đặt tên file tự động, xuất PDF hàng loạt.

## Cách dễ nhất: mẫu Word có "chỗ trống" đặt tên
Thư viện **docxtpl** cho phép bạn soạn mẫu bằng Word bình thường, chỉ thay chỗ cần điền bằng tên trong ngoặc nhọn kép:
~~~
BIÊN BẢN GIAO NHẬN THỰC PHẨM
Hôm nay, ngày {{ ngay }}, tại {{ dia_diem }}
Bên giao: {{ ben_giao }}
Tổng giá trị: {{ tong_tien }} đồng (Bằng chữ: {{ bang_chu }})
~~~
~~~python
from docxtpl import DocxTemplate
import pandas as pd

ds = pd.read_excel("du_lieu_bien_ban.xlsx")
for _, dong in ds.iterrows():
    mau = DocxTemplate("mau_bien_ban.docx")
    mau.render({
        "ngay": dong["Ngày"],
        "dia_diem": dong["Địa điểm"],
        "ben_giao": dong["Bên giao"],
        "tong_tien": f"{int(dong['Tổng tiền']):,}".replace(",", "."),
        "bang_chu": dong["Bằng chữ"],
    })
    mau.save(f"Bien_ban_{dong['Mã']}.docx")
~~~
Cài: pip install docxtpl. Mẫu giữ nguyên phông chữ, căn lề, quốc hiệu, chữ ký mà bạn đã chỉnh trong Word, nên thể thức văn bản không bị sai.

docxtpl còn lặp được **bảng hàng hóa có số dòng thay đổi** (cú pháp vòng lặp trong mẫu). Khi cần, nói với AI: "Mẫu có bảng hàng hóa, số dòng thay đổi theo dữ liệu, dùng vòng lặp của docxtpl."

Bạn làm việc trong ngành Công an, tại cơ sở có dữ liệu cá nhân nhạy cảm của người cai nghiện. Một lần dán nhầm có thể gây hậu quả nghiêm trọng cho người khác và cho chính bạn. AI rất hữu ích, nhưng **dữ liệu đã gửi lên dịch vụ AI bên ngoài thì bạn không còn kiểm soát được hoàn toàn**.

## Căn cứ (cần kiểm tra lại văn bản hiện hành)
- Các quy định về **bảo vệ bí mật nhà nước**.
- Các quy định về **bảo vệ dữ liệu cá nhân** (Nghị định 13/2023/NĐ-CP và Luật Bảo vệ dữ liệu cá nhân năm 2025; cần kiểm tra lại hiệu lực và văn bản hướng dẫn).

## 3 vùng dữ liệu
| Vùng | Ví dụ | Với AI bên ngoài |

### Script thống kê mẫu (đọc hiểu trước khi chạy)
~~~python
import pandas as pd

df = pd.read_csv("lich_su.csv")
df = df[df["Type"].isin(["buy", "sell"])]                 # chỉ giữ lệnh mua/bán
df["Lai_lo"] = df["Profit"] + df.get("Commission", 0) + df.get("Swap", 0)
df["Gio"] = pd.to_datetime(df["Time"]).dt.hour            # giờ vào lệnh

thang = df[df["Lai_lo"] > 0]
thua = df[df["Lai_lo"] < 0]
print("Số lệnh:", len(df))
print("Tỷ lệ thắng:", round(len(thang) / len(df) * 100, 1), "%")
print("Lãi TB:", round(thang["Lai_lo"].mean(), 2), "| Lỗ TB:", round(thua["Lai_lo"].mean(), 2))
print("Lệnh lỗ lớn nhất:", thua["Lai_lo"].min())
print(df.groupby("Symbol")["Lai_lo"].agg(["count", "sum"]))
print(df.groupby("Gio")["Lai_lo"].agg(["count", "sum"]))
print(df.groupby("Volume")["Lai_lo"].agg(["count", "sum"]))  # khối lượng lớn có lỗ nhiều hơn?
~~~

Tuần này không dạy cách "thắng thị trường". Tuần này dạy cách **không để mất tiền vì chính mình**, và dùng AI để giữ kỷ luật. Ba sự thật cần chấp nhận trước:

title: "Lot, pip, đòn bẩy, ký quỹ, stop out, spread, swap",
goal: "Hiểu chính xác mỗi lệnh có thể làm mất bao nhiêu tiền.",
practice: "Dùng máy tính khối lượng lệnh trong app với 5 tình huống.",
content: `
> Thông số hợp đồng (kích thước lot, giá trị pip, đòn bẩy, mức stop out) **khác nhau theo sàn và loại tài khoản**, ví dụ tài khoản Cent tính bằng cent. Số liệu dưới đây là quy ước phổ biến để hiểu nguyên lý; **cần đối chiếu** trong MetaTrader: chuột phải mã → Đặc tả (Specification).

## Lot – khối lượng
- Forex: 1 lot chuẩn thường = 100.000 đơn vị đồng tiền đứng trước (EURUSD: 100.000 EUR). 0,1 lot = mini; 0,01 lot = micro.
- Vàng XAUUSD: 1 lot thường = 100 oz.

## Pip – bước giá
- EURUSD: 1 pip = 0,0001. Giá từ 1,1000 lên 1,1020 là **20 pip**.
- Với cặp có USD đứng sau (EURUSD, GBPUSD...): **1 pip của 1 lot ≈ 10 USD**.
- Vàng: giá đi 1 USD (ví dụ 4.000 → 4.001) thì **1 lot lãi/lỗ 100 USD**.

## Ví dụ làm bạn giật mình
Tài khoản 500 USD, vào **1 lot vàng**, giá đi ngược **5 USD** (dao động rất bình thường trong một phiên):
**5 × 100 = 500 USD → mất toàn bộ tài khoản.**
Cùng tình huống với 0,01 lot: mất 5 USD = 1% vốn.
**Không phải thị trường làm cháy tài khoản. Khối lượng lệnh làm cháy tài khoản.**

## Đòn bẩy và ký quỹ
- **Đòn bẩy 1:500** nghĩa là chỉ cần đặt **ký quỹ** khoảng 1/500 giá trị lệnh. Ví dụ lệnh 1 lot EURUSD giá 1,10 (giá trị 110.000 USD) chỉ cần khoảng 220 USD ký quỹ.
- Đòn bẩy cao **không làm lệnh rủi ro hơn**, nó **cho phép bạn mở lệnh quá lớn** so với vốn. Đó mới là nguy hiểm.
- Rủi ro thật của lệnh = **khối lượng × khoảng dừng lỗ**, không phải ký quỹ.

## Margin call, stop out
- **Margin call**: tài khoản sắp không đủ ký quỹ, sàn cảnh báo.
- **Stop out**: sàn **tự động đóng lệnh** của bạn vì không đủ ký quỹ, thường khi đã lỗ rất nặng. Ai gồng lỗ đến stop out là đã để sàn đặt dừng lỗ thay mình, ở mức tệ nhất.

## Spread, swap, commission – chi phí âm thầm
- **Spread**: chênh lệch giá mua/bán; vào lệnh là âm ngay một khoản.
- **Commission**: phí giao dịch (tùy loại tài khoản).
- **Swap**: phí (hoặc tiền nhận) khi giữ lệnh qua đêm.
Giao dịch càng nhiều lệnh (overtrading), chi phí cộng dồn càng lớn.

## Công thức quan trọng nhất của khóa học
~~~
Số tiền rủi ro = Vốn × % rủi ro
Lot = Số tiền rủi ro ÷ (Khoảng SL × Giá trị 1 pip của 1 lot)
~~~
Ví dụ: vốn 1.000 USD, rủi ro 1% = 10 USD, SL 20 pip EURUSD → lot = 10 ÷ (20 × 10) = **0,05 lot**.
Vàng: vốn 1.000 USD, rủi ro 1% = 10 USD, SL 5 USD → lot = 10 ÷ (5 × 100) = **0,02 lot**.
App đã có sẵn công cụ này: **Giao dịch → Khối lượng lệnh**.
`,

  "Đòn bẩy cao chỉ cho phép mở lệnh lớn hơn; stop out là để sàn đóng lệnh ở mức tệ nhất.",

content: `
## Vì sao cảm xúc làm mất tiền?
Khi căng thẳng, sợ hãi hay hưng phấn, con người ra quyết định **nhanh và thiên lệch**: thấy giá chạy thì sợ lỡ (FOMO), vừa thua thì muốn gỡ ngay (revenge trading), vừa thắng thì tự tin quá mức và tăng khối lượng.

## 5 trạng thái nguy hiểm
| Trạng thái | Câu nói trong đầu | Hậu quả |
| FOMO (sợ lỡ) | "Không vào bây giờ là lỡ mất" | Vào lệnh muộn, không theo kế hoạch |
| Gỡ lỗ (revenge) | "Phải lấy lại ngay số vừa mất" | Tăng khối lượng, vào lệnh liên tục |
| Hưng phấn sau thắng | "Mình đọc thị trường chuẩn rồi" | Bỏ quy tắc, tăng lot |
| Chán, rảnh | "Vào một lệnh cho vui" | Overtrading |
| Mệt, căng thẳng việc khác | "Làm nhanh cho xong" | Sai sót, quên đặt SL |

## Công cụ 1: chấm điểm cảm xúc trước MỌI lệnh
Thang 1–5 trong app: 1 rất bình tĩnh → 5 cay cú/kích động. **Từ 4 trở lên: không vào lệnh.** Không có ngoại lệ. Chỉ việc gọi tên cảm xúc của mình cũng đã giúp bạn chậm lại.

## Công cụ 2: bảng kiểm trước khi vào lệnh
App có sẵn ở **Giao dịch → Tổng quan**: 8 câu hỏi + điểm cảm xúc + tự động kiểm tra giới hạn ngày. Chỉ một câu không đạt là **KHÔNG VÀO LỆNH**. Bảng kiểm biến một quyết định cảm tính thành **một thủ tục**, giống quy trình kiểm tra trước khi ký chứng từ.

## Công cụ 3: quy tắc 10 phút
Thấy "cơ hội" ngoài kế hoạch: đứng dậy, rời màn hình 10 phút. Quay lại mà vẫn đúng mọi điều kiện của kế hoạch thì mới xét. Phần lớn "cơ hội không thể bỏ lỡ" sẽ tự biến mất.

## Công cụ 4: AI làm "người giám sát"
Trước lệnh, dán thông tin lệnh và kế hoạch cho AI (prompt "Giám sát kỷ luật trước khi vào lệnh" trong mục Prompt). AI **không phán giá lên xuống**, chỉ chỉ ra lệnh vi phạm điều nào trong kế hoạch. Gõ ra thông tin lệnh cũng là một cách làm chậm lại.

## Dùng dữ liệu để thuyết phục chính mình
Sau 2–3 tuần ghi nhật ký có điểm cảm xúc, xem **Thống kê → Theo mức cảm xúc**. Với hầu hết người giao dịch, nhóm 4–5 điểm là nhóm thua đậm nhất. Khi chính số liệu của bạn chứng minh điều đó, quy tắc "4 điểm là dừng" sẽ dễ giữ hơn rất nhiều.
`,

{

title: "Lỗi 2: Gồng lỗ và dời dừng lỗ",
goal: "Đặt SL ngay khi vào lệnh, không dời SL xa hơn, không nhồi lệnh khi đang lỗ.",
practice: "Thống kê các lệnh đã dời SL trong nhật ký và kết quả của chúng.",
content: `
## Gồng lỗ là gì và vì sao ai cũng mắc?
**Gồng lỗ** là giữ lệnh đang lỗ với hy vọng giá quay lại, thay vì cắt lỗ đúng mức đã định. Não người **ghét chốt lỗ** (cảm giác "nhận thua") hơn là ghét **lỗ thêm**. Vì vậy ta hay:
- Không đặt SL ("để theo dõi đã").
- **Dời SL ra xa hơn** khi giá sắp chạm.
- **Nhồi thêm lệnh** cùng chiều khi đang lỗ ("trung bình giá").
- Chốt lời rất sớm khi đang lãi (sợ mất lãi), nhưng để lỗ chạy rất xa.
Kết quả kinh điển: **thắng nhiều lệnh nhỏ, thua vài lệnh rất lớn**, tổng vẫn âm.

## Dấu hiệu trong số liệu của bạn
Mở **Thống kê**:
- **Lỗ trung bình lớn hơn lãi trung bình** (R:R thực tế dưới 1:1).
- **Lệnh lỗ lớn nhất** gấp nhiều lần mức rủi ro 1% vốn.
- Nhóm "Có dời SL" tổng âm nặng.
App tự hiện cảnh báo các dấu hiệu này ở mục "Điều số liệu đang nói".

## Toán học của lệnh lỗ lớn
| Mất | Cần lãi bao nhiêu % để về lại vốn |
| 10% | 11,1% |
| 20% | 25% |
| 30% | 42,9% |
| 50% | 100% |
| 70% | 233% |
| 90% | 900% |
Một lần gồng lỗ mất 50% vốn cần **gấp đôi** số vốn còn lại mới hòa. Đó là lý do cắt lỗ nhỏ, sớm, đúng mức đã định.

## 4 quy tắc chống gồng lỗ
1. **SL đặt ngay khi vào lệnh**, ngay trên phần mềm, không để "trong đầu".
2. **SL chỉ được dời theo hướng giảm rủi ro** (dời về hòa vốn khi đã lãi), **không bao giờ dời ra xa hơn**.
3. **Không nhồi lệnh khi đang lỗ.** Muốn vào thêm thì phải là một lệnh mới, qua bảng kiểm mới, và tổng rủi ro vẫn trong giới hạn.
4. **Chấp nhận SL là chi phí kinh doanh**, như tiền điện, tiền thuê mặt bằng. Lệnh chạm SL đúng kế hoạch là **lệnh đúng**, dù thua tiền.

## Đổi cách chấm điểm bản thân
Đừng chấm mình theo "lệnh này lãi hay lỗ". Hãy chấm theo **"lệnh này có đúng kế hoạch không"**. Trong nhật ký, cột "Đúng kế hoạch" và "Dời SL" quan trọng hơn cột lãi/lỗ. Một lệnh thua đúng kế hoạch đáng khen hơn một lệnh thắng nhờ gồng lỗ may mắn, vì lần sau gồng lỗ có thể mất cả tài khoản.
`,

| Đánh giá | Cuối tuần xuất nhật ký cho AI phân tích |

## Viết điều kiện vào lệnh sao cho kiểm tra được
| Mơ hồ (không dùng được) | Kiểm tra được |

(Các ví dụ trên chỉ minh họa cách **viết** điều kiện, không phải khuyến nghị một phương pháp giao dịch.)

- In kế hoạch, dán cạnh màn hình.

practice: "Mô phỏng 20 lệnh thua liên tiếp ở mức rủi ro 1% và 10% để so sánh.",
content: `
## Quản lý vốn là "phanh" của chiếc xe
Phương pháp giao dịch là động cơ, quản lý vốn là phanh. Xe động cơ mạnh mà không phanh sẽ sớm gặp tai nạn. Người mới hay mải tìm "động cơ" (điểm vào lệnh) mà bỏ quên phanh.

## Chuỗi thua chắc chắn sẽ đến
Ngay cả phương pháp có tỷ lệ thắng 50%, chuỗi **5–8 lệnh thua liên tiếp** trong vài trăm lệnh là chuyện bình thường về mặt xác suất. Câu hỏi không phải "có thua liên tiếp không" mà là "**thua liên tiếp thì còn lại bao nhiêu vốn**".

| Rủi ro mỗi lệnh | Sau 5 lệnh thua | Sau 10 lệnh thua | Sau 20 lệnh thua |
| 1% | còn 95,1% | còn 90,4% | còn 81,8% |
| 2% | còn 90,4% | còn 81,7% | còn 66,8% |
| 5% | còn 77,4% | còn 59,9% | còn 35,8% |
| 10% | còn 59,0% | còn 34,9% | còn 12,2% |
(Tính theo rủi ro % trên vốn còn lại sau mỗi lệnh.)

Ở 1%, 20 lệnh thua vẫn còn hơn 80% vốn để làm tiếp. Ở 10%, 10 lệnh thua đã mất gần 2/3 tài khoản và cần lãi gần 190% mới hòa.

## Tỷ lệ thắng hòa vốn theo R:R
Bạn không cần thắng nhiều nếu lãi mỗi lệnh thắng lớn hơn lỗ mỗi lệnh thua:
| R:R | Tỷ lệ thắng tối thiểu để hòa (chưa tính phí) |
| 1 : 1 | 50% |
| 1 : 1,5 | 40% |
| 1 : 2 | 33,3% |
| 1 : 3 | 25% |

## Kỳ vọng mỗi lệnh (expectancy)
~~~
Kỳ vọng = (Tỷ lệ thắng × Lãi TB) − (Tỷ lệ thua × Lỗ TB)
~~~
Ví dụ: thắng 40%, lãi TB 15 USD, lỗ TB 10 USD → 0,4 × 15 − 0,6 × 10 = 0. Hòa vốn, chưa tính phí. Kỳ vọng âm thì càng giao dịch nhiều càng lỗ nhiều, tăng khối lượng chỉ làm lỗ nhanh hơn.

## Quy tắc quản lý vốn cho bạn
1. **Rủi ro 0,5–1% vốn mỗi lệnh.** Khối lượng **luôn** lấy từ máy tính, không ước lượng.
2. **Tổng rủi ro các lệnh đang mở** không quá 2% vốn.
3. **Không tăng khối lượng để gỡ lỗ.** Sau chuỗi thua có thể giảm rủi ro xuống 0,5%.
4. Chỉ nạp tiền **sẵn sàng mất toàn bộ**; không vay, không dùng tiền sinh hoạt gia đình.
5. **Không nạp thêm** để "cứu" tài khoản đang lỗ.
`,

  "Chuỗi thua chắc chắn xảy ra; rủi ro 1%/lệnh thì 20 lệnh thua vẫn còn hơn 80% vốn, rủi ro 10% chỉ còn 12%.",
  "R:R 1:2 chỉ cần thắng trên 33% để hòa; kỳ vọng = tỷ lệ thắng × lãi TB − tỷ lệ thua × lỗ TB.",
  "Rủi ro 0,5–1%/lệnh, khối lượng từ máy tính, không tăng lot để gỡ, chỉ dùng tiền sẵn sàng mất."
],

{

title: "AI phân tích nhật ký giao dịch & backtest nhập môn",

practice: "Xuất nhật ký từ app cho AI phân tích; lập lộ trình demo 30 ngày.",
content: `
## Quy trình phân tích hằng tuần (30 phút, mỗi Chủ nhật)
1. Bổ sung đủ cột cảm xúc, đúng kế hoạch, dời SL cho các lệnh trong tuần.
2. Xem tab **Thống kê**: tỷ lệ tuân thủ, nhóm thua nhiều nhất.
3. Bấm **Xuất dữ liệu cho AI phân tích** (Giao dịch → Nhật ký). App tạo sẵn prompt kèm kế hoạch và bảng CSV (không có số tài khoản).
4. Dán vào AI. Yêu cầu AI **tính bằng code**, không tính nhẩm.
5. Chọn **đúng 1 quy tắc** cải thiện cho tuần sau, ghi vào Kế hoạch.

## Đọc kết quả AI thế nào cho đúng?
- **Mẫu nhỏ thì kết luận yếu.** 15 lệnh chưa đủ để nói "giờ 21h là giờ xấu". Hãy hỏi AI: "Với số lệnh này, kết luận nào đáng tin, kết luận nào chỉ là ngẫu nhiên?"
- **Tập trung vào hành vi** (vi phạm kế hoạch, cảm xúc, khối lượng) hơn là "phương pháp".
- Nếu AI bắt đầu gợi ý **dự đoán giá hay điểm vào lệnh**, nhắc lại: "Không phân tích dự đoán giá."

## Backtest là gì?
**Backtest** = chạy thử một quy tắc giao dịch trên **dữ liệu giá quá khứ** để xem nếu đã áp dụng thì kết quả ra sao. Dùng được để:
- **Loại bỏ** nhanh những ý tưởng tệ (backtest đã thua thì giao dịch thật càng khó thắng).
- Hiểu **chuỗi thua dài nhất, mức sụt vốn** của một quy tắc.

## Giới hạn của backtest (rất quan trọng)
| Bẫy | Nghĩa |
| Quá khớp (overfitting) | Chỉnh thông số đến khi đẹp với dữ liệu cũ, gặp dữ liệu mới thì hỏng |
| Bỏ quên chi phí | Không tính spread, commission, swap, trượt giá |
| Nhìn trước tương lai | Code vô tình dùng dữ liệu "chưa xảy ra" tại thời điểm vào lệnh |
| Mẫu ngắn | Vài tháng dữ liệu không đại diện cho nhiều kiểu thị trường |
| Khác biệt tâm lý | Máy tính không sợ, không tham; bạn thì có |
**Backtest đẹp không bảo đảm tương lai.** Buổi 42 (nâng cao) học kiểm chứng kỹ hơn.

## Lộ trình phục hồi đề xuất
| Giai đoạn | Việc | Điều kiện qua |
| 1. Dừng tiền thật | Tìm hiểu quy định pháp luật và quy định ngành | Đã kiểm tra quy định |
| 2. Demo 30 ngày | Giao dịch đúng kế hoạch, ghi nhật ký 100% | Tuân thủ 100% suốt 30 ngày |
| 3. Đánh giá | Cho AI phân tích nhật ký 30 ngày | Kỳ vọng mỗi lệnh dương, có đủ số lệnh |
| 4. Quyết định | Tự cân nhắc trách nhiệm pháp lý và tài chính | Quyết định của bạn |
Nếu không qua được giai đoạn 2 (vẫn vi phạm kế hoạch), câu trả lời trung thực là: **giao dịch chưa phù hợp với bạn lúc này**. Thời gian và công sức có thể đầu tư vào kỹ năng AI để kiếm tiền ổn định hơn (buổi 29).
`,

  "Lộ trình: dừng tiền thật → demo 30 ngày tuân thủ 100% → AI đánh giá → tự quyết định."

## Lợi thế thật của bạn
Bạn không cạnh tranh với lập trình viên. Lợi thế của bạn là **hiểu nghiệp vụ kế toán, sổ sách, biểu mẫu** + **biết dùng AI để làm công cụ**. Rất nhiều cửa hàng, hộ kinh doanh, quán ăn, cơ sở nhỏ đang quản lý bằng sổ tay hoặc Excel lộn xộn, và cần đúng thứ bạn làm được.

## Lưu ý quy định trước tiên
> Cán bộ, chiến sĩ Công an có các quy định riêng về làm thêm, kinh doanh, thành lập hoặc tham gia quản lý doanh nghiệp (Luật Công an nhân dân, Luật Phòng, chống tham nhũng và văn bản của ngành). **Cần kiểm tra lại** và hỏi bộ phận tổ chức/pháp chế đơn vị trước khi nhận tiền từ dịch vụ. Không dùng thời gian, thiết bị, dữ liệu, danh nghĩa cơ quan cho việc riêng. Nếu chưa được làm dịch vụ có thu, các kỹ năng này vẫn có giá trị lớn: làm công việc ở cơ quan nhanh và chính xác hơn, và hỗ trợ gia đình (người thân kinh doanh).

## 5 hướng phù hợp
| Hướng | Sản phẩm cụ thể | Độ khó |
| Công cụ Excel | File quản lý bán hàng, kho, công nợ, chấm công, tính lương có công thức và báo cáo tự động | Thấp |
| App nhỏ offline | Sổ bán hàng, quản lý kho trên điện thoại (PWA như app này) | Trung bình |
| Tự động hóa văn phòng | Script tạo hợp đồng/biên bản/hóa đơn nội bộ hàng loạt từ Excel | Trung bình |
| Dịch vụ sổ sách có AI hỗ trợ | Sắp xếp chứng từ, lập bảng kê, báo cáo cho hộ kinh doanh | Thấp – trung bình |
| Bán mẫu / dạy lại | Bộ mẫu Excel, bộ prompt cho kế toán, lớp hướng dẫn dùng AI cơ bản | Thấp |

## Tìm 3 khách hàng đầu tiên
1. **Người quen**: gia đình, bạn bè đang kinh doanh. Làm thử miễn phí hoặc giá thấp đổi lấy nhận xét và cho phép dùng làm ví dụ.
2. **Một nghề, một vấn đề**: chọn một nhóm (ví dụ quán ăn) và một vấn đề (tính nguyên liệu, công nợ nhà cung cấp). Chuyên một thứ dễ được giới thiệu hơn làm mọi thứ.
3. **Có sản phẩm mẫu để khoe**: video ngắn quay màn hình công cụ đang chạy với dữ liệu giả.

## Báo giá thế nào?
- **Không có "giá chuẩn"**; giá thị trường thay đổi và khác vùng, cần tự tìm hiểu.
- Cách tính an toàn: **ước số giờ làm × mức giá giờ bạn chấp nhận + thời gian hỗ trợ sau bàn giao**.
- Ghi rõ **phạm vi**: làm những gì, **không** làm những gì, sửa miễn phí mấy lần, bảo hành bao lâu.
- Thu một phần trước, phần còn lại khi bàn giao.
- Dùng prompt "Viết báo giá dịch vụ" trong mục Prompt.

## Tránh những cái bẫy
- Hứa làm "phần mềm lớn" (nhiều người dùng, phân quyền, dữ liệu online) khi chưa có kinh nghiệm → dễ thất bại. Bắt đầu nhỏ.

- Không có tài liệu hướng dẫn, không sao lưu → khách mất dữ liệu là mất uy tín.
- Bán "khóa học làm giàu bằng AI" hay "bot trading": không làm, vì dễ trở thành chính chiêu lừa ở buổi 22.

content: `
## Excel vẫn là công cụ số 1 của kế toán
Trước khi viết code, hãy hỏi: **Excel làm được không?** Nhiều việc chỉ cần công thức tốt, không cần Python. AI giúp bạn viết những công thức mà trước đây phải tra cứu rất lâu.

> Một số hàm dưới đây (XLOOKUP, FILTER, UNIQUE, SORT, LET) chỉ có trong **Excel 2021 / Microsoft 365**. Excel 2016/2019 không có, khi đó dặn AI: "Tôi dùng Excel 2016, chỉ dùng hàm có trong bản này."

## Hàm tra cứu và tổng có điều kiện
| Việc | Hàm | Ví dụ |
| Tra đơn giá theo tên hàng | XLOOKUP (hoặc VLOOKUP / INDEX+MATCH) | =XLOOKUP(B2; DM!A:A; DM!C:C; "Không có") |
| Tổng theo nhiều điều kiện | SUMIFS | =SUMIFS(F:F; B:B; "Gạo"; A:A; ">="&DATE(2026;11;1)) |
| Đếm theo điều kiện | COUNTIFS | =COUNTIFS(C:C; "B"; E:E; "Đang cai nghiện") |
(Máy cài định dạng Việt Nam thường dùng dấu **;** để ngăn cách đối số; máy định dạng Mỹ dùng dấu **,**. Nói rõ với AI máy bạn dùng dấu nào.)

## Hàm "mảng động": một công thức trả về cả bảng
~~~
=UNIQUE(B2:B500)                         danh sách tên hàng không trùng
=SORT(UNIQUE(B2:B500))                   ... và sắp xếp A–Z
=FILTER(A2:F500; C2:C500="Phân khu B")   lọc mọi dòng của Phân khu B
=SUMIFS(F2:F500; B2:B500; H2#)           tổng theo từng tên hàng ở cột H (H2# = cả mảng)
~~~
Bảng kê tổng hợp tự cập nhật khi thêm dòng mới, không cần kéo công thức.

## PivotTable: báo cáo trong 1 phút
Insert → PivotTable → kéo **Tên hàng** vào Rows, **Thành tiền** vào Values, **Ngày** vào Columns hoặc Filters. Đây chính là groupby của pandas, bằng chuột. Nhờ AI: "Tôi muốn báo cáo X, hướng dẫn tôi kéo thả PivotTable từng bước."

## Kiểm soát dữ liệu đầu vào (Data Validation)
Sai số liệu thường do **nhập sai**: gõ "Thit heo" thay vì "Thịt heo", số âm, ngày sai tháng. Phòng từ gốc:
- Data → Data Validation → **List**: chọn tên hàng từ danh mục, không gõ tay.
- Giới hạn số: Whole number/Decimal ≥ 0.
- Giới hạn ngày trong tháng đang làm.
- **Conditional Formatting**: tô đỏ ô vượt định mức, ô trống bắt buộc.

## Bảng (Table) thay cho vùng dữ liệu
Ctrl+T để biến vùng thành **Table**: công thức tự kéo xuống, PivotTable tự nhận dòng mới, công thức đọc dễ hơn (=[@[Số lượng]]*[@[Đơn giá]]). Đây là thói quen nhỏ giúp file "sống" lâu.

## Cách nhờ AI làm Excel hiệu quả
1. Nói **phiên bản Excel** và **dấu ngăn cách** (; hay ,).
2. Mô tả **tên sheet, cột, dòng tiêu đề**, kèm 3 dòng dữ liệu giả.
3. Yêu cầu **giải thích từng phần** công thức.
4. **Thử với ô biết đáp án** trước khi kéo cho cả bảng.
`,

content: `
## Power Query là gì?
**Power Query** (Data → Get & Transform Data) là công cụ có sẵn trong Excel 2016 trở lên để **lấy, gộp, làm sạch** dữ liệu theo các bước được **ghi lại**. Thiết lập một lần, tháng sau chỉ cần bấm **Refresh**. Đây là "tự động hóa không cần code" mạnh nhất của Excel.

## Khi nào dùng Power Query, khi nào dùng Python?
| Power Query | Python |
| Gộp nhiều sheet/file cùng cấu trúc, làm sạch, đổi kiểu | Logic phức tạp, điền mẫu Word/Excel có định dạng |
| Người dùng chỉ cần Excel, bấm Refresh | Cần cài Python trên máy chạy |
| Người khác trong đơn vị dễ tiếp nhận | Linh hoạt, làm được gần như mọi thứ |
Với báo cáo định kỳ trong Excel, **Power Query thường là lựa chọn bền vững hơn**.

## Các bước gộp nhiều sheet trong một file
1. Data → Get Data → From File → From Workbook → chọn chính file đặt hàng tháng (hoặc bản sao).
2. Trong Navigator, chọn **tên file (dòng trên cùng)** → Transform Data.
3. Lọc cột Kind = Sheet; giữ cột Name (tên sheet = ngày) và Data.
4. Bấm biểu tượng mở rộng ở cột Data → chọn các cột cần lấy.
5. Use First Row as Headers; lọc bỏ các dòng tiêu đề lặp lại, dòng trống, dòng "Tổng".
6. Đổi kiểu dữ liệu: Số lượng, Đơn giá → số; Ngày → ngày.
7. Close & Load → ra một bảng tổng.
Giao diện có thể khác chút theo phiên bản, cần kiểm tra lại. Làm sai bước nào, ô **Applied Steps** bên phải cho phép xóa bước đó.

## Gộp nhiều file trong một thư mục
Data → Get Data → From File → **From Folder** → chọn thư mục chứa file các tháng → Combine & Transform. Thêm file tháng mới vào thư mục, bấm Refresh.

## Làm sạch thường gặp
- Trim/Clean: bỏ khoảng trắng thừa, ký tự lạ ở tên hàng.
- Replace Values: "Thit heo" → "Thịt heo".
- Split Column: tách "25 kg" thành số và đơn vị.
- Merge Queries: ghép đơn giá từ bảng danh mục (giống XLOOKUP).
- Group By: tổng theo mặt hàng.

## Ngôn ngữ M: AI viết hộ
Mỗi bước Power Query thực chất là một dòng code ngôn ngữ **M** (xem ở Advanced Editor). Bạn có thể:
- Dán code M cho AI để **giải thích từng bước**.
- Nhờ AI **viết code M** rồi dán vào Advanced Editor.
Đặc biệt hữu ích khi sheet có tiêu đề nhiều tầng, ô gộp.

content: `
## VBA là gì?
**VBA** là ngôn ngữ lập trình **có sẵn trong Excel/Word**. Macro VBA chạy ngay trong file (.xlsm), không cần cài thêm gì. Phù hợp cho thao tác **bên trong file Excel**: tạo sheet, định dạng, in hàng loạt, nút bấm.

## Chọn công cụ nào?
| Việc | Nên dùng |
| Gộp/làm sạch dữ liệu định kỳ | Power Query |
| Nút bấm trong file để tạo sheet ngày mới, in biên bản, định dạng | VBA |
| Xử lý nhiều file, tạo Word hàng loạt, logic phức tạp, thống kê | Python |
| Người khác trong đơn vị cũng phải dùng, máy họ không có Python | Power Query hoặc VBA |

## Ví dụ macro đọc hiểu được
~~~vba
Sub TaoSheetNgayMoi()
    Dim tenMoi As String
    tenMoi = InputBox("Nhập ngày (ví dụ 16):")
    If tenMoi = "" Then Exit Sub
    Sheets("Mau").Copy After:=Sheets(Sheets.Count)   ' chép sheet mẫu ra cuối
    ActiveSheet.Name = tenMoi                          ' đặt tên theo ngày
    Range("B2").Value = tenMoi & "/" & Month(Date) & "/" & Year(Date)
End Sub
~~~
Bạn đọc được nhờ Tuần 2: có **biến** (Dim), **if**, và các bước tuần tự. Dấu nháy đơn ' là chú thích.

## Cách chạy
1. File → Options → Customize Ribbon → tick **Developer**.
2. Developer → Visual Basic → Insert → Module → dán code.
3. Lưu file dạng **.xlsm** (Excel Macro-Enabled).
4. Developer → Macros → chọn macro → Run. Hoặc gắn vào một nút (Insert → Button).

## An toàn với macro
- **Macro có thể chứa mã độc.** Không bật macro trong file lạ nhận qua mạng, email. Excel mặc định chặn macro trong file tải từ Internet là có lý do.
- Macro **không có Undo (Ctrl+Z)**: chạy xong là thay đổi luôn. **Luôn chạy trên bản sao** lần đầu.
- Đọc lướt code AI viết: có lệnh **Delete, Kill (xóa file), Clear** ở chỗ bạn không mong đợi không?
- Máy cơ quan có thể bị chính sách chặn macro; tuân thủ quy định CNTT của đơn vị.

## Nhờ AI viết macro hiệu quả
Nói rõ: tên sheet, ô nào chứa gì, việc cần làm từng bước, và yêu cầu "**hỏi xác nhận trước khi xóa hay ghi đè bất cứ thứ gì**" (MsgBox với Yes/No).
`,

content: `
## Vì sao phần mềm làm bằng AI hay "hỏng giữa chừng"?
Không phải vì AI kém, mà vì **yêu cầu mơ hồ**. "Làm phần mềm quản lý kho" có trăm cách hiểu. Người làm phần mềm chuyên nghiệp luôn viết **bản đặc tả** trước. Bạn đã quen với việc này: đó chính là **master prompt chi tiết**.

## Bản đặc tả gồm 8 mục
1. **Mục đích**: giải quyết vấn đề gì, đo thành công bằng gì (tiết kiệm bao nhiêu phút/tháng).
2. **Người dùng**: ai, mấy người, trình độ, dùng trên thiết bị gì.
3. **Dữ liệu**: những "bảng" nào, mỗi bảng có những cột gì (buổi 35).
4. **Chức năng**: danh sách việc người dùng làm được, viết dạng "Người dùng có thể ...".
5. **Màn hình**: liệt kê các màn hình và nội dung chính của từng màn hình.
6. **Quy tắc nghiệp vụ**: định mức, điều kiện cảnh báo, cách làm tròn, ai được sửa gì.
7. **Ràng buộc**: offline hay online, lưu ở đâu, sao lưu thế nào, bảo mật.
8. **Ngoài phạm vi**: những gì **không** làm ở phiên bản này.

## Chọn kiểu phần mềm
| Kiểu | Hợp khi | Ví dụ |
| File Excel + công thức/Power Query | Một người dùng, dữ liệu dạng bảng | Bảng kê, báo cáo tháng |
| PWA offline (như app này) | Một/vài người, mỗi người dữ liệu riêng, cần dùng trên điện thoại | Sổ tay, checklist, công cụ tính |
| Script Python | Xử lý file hàng loạt, chạy theo đợt | Tạo biên bản, gộp file |
| Phần mềm nhiều người dùng chung (có máy chủ, cơ sở dữ liệu) | Nhiều người cùng nhập, cần phân quyền, nhật ký sửa | Hệ thống quản lý đơn vị |
Kiểu cuối **phức tạp hơn rất nhiều** (bảo mật, máy chủ, bảo trì) và với dữ liệu nghiệp vụ của cơ quan **phải được đơn vị cho phép** và tuân thủ quy định bảo mật. Người mới nên bắt đầu từ 3 kiểu đầu.

## Phiên bản 1 phải nhỏ (MVP)
**MVP** (sản phẩm khả dụng tối thiểu) = phiên bản nhỏ nhất **dùng được thật**. Ví dụ phần mềm trang cấp phiên bản 1: danh mục vật tư, nhập phiếu xuất, báo cáo tồn. Chưa cần in phiếu đẹp, chưa cần biểu đồ. Dùng thật 2 tuần rồi mới thêm.

## Mẫu câu chức năng tốt
| Mơ hồ | Rõ ràng |
| "Quản lý xuất kho" | "Người dùng chọn vật tư từ danh mục, nhập số lượng, ngày, phân khu nhận; phần mềm chặn nếu số lượng lớn hơn tồn kho." |
| "Có báo cáo" | "Báo cáo tồn theo tháng: mỗi vật tư một dòng gồm tồn đầu, nhập, xuất, tồn cuối; xuất ra Excel." |
`,

content: `
## Dữ liệu sai thiết kế = phần mềm khó sửa mãi
Giao diện sửa được dễ. **Cấu trúc dữ liệu sai** thì càng dùng lâu càng khó sửa. Đây là phần đáng đầu tư suy nghĩ nhất.

## 3 khái niệm cốt lõi
| Khái niệm | Nghĩa | Ví dụ |
| **Bảng** | Một loại đối tượng, mỗi dòng một đối tượng | Bảng Vật tư, bảng Phiếu xuất |
| **Khóa chính** | Mã duy nhất của mỗi dòng | Mã vật tư VT001 |
| **Khóa ngoại / quan hệ** | Cột trỏ tới dòng của bảng khác | Phiếu xuất có cột Mã vật tư trỏ tới bảng Vật tư |

## Ví dụ thiết kế cho phần mềm trang cấp
~~~
VAT_TU     (ma_vt*, ten, dvt, nhom, ton_dau_ky)
PHAN_KHU   (ma_pk*, ten)                      A, B, C
PHIEU      (so_phieu*, ngay, loai[Nhập/Xuất], ma_pk, ghi_chu)
CHI_TIET   (so_phieu, ma_vt, so_luong)        mỗi phiếu nhiều dòng
(* = khóa chính)
~~~
**Tồn kho không lưu thành một con số sửa tay**, mà **tính ra**: tồn đầu + tổng nhập − tổng xuất. Như vậy số liệu luôn khớp với chứng từ, đúng tinh thần kế toán.

## 4 nguyên tắc thiết kế
1. **Mỗi thông tin chỉ lưu một chỗ.** Tên vật tư nằm ở bảng Vật tư; phiếu chỉ lưu mã. Đổi tên một lần, mọi nơi cập nhật.
2. **Dùng mã, không dùng tên để liên kết.** Tên có thể gõ sai, trùng; mã thì không.
3. **Lưu chứng từ gốc, tính ra kết quả.** Không sửa tay số tồn, số tổng.
4. **Không xóa chứng từ, chỉ hủy có ghi lý do.** Giữ dấu vết như sổ kế toán.

## Lưu dữ liệu ở đâu?
| Nơi lưu | Dùng khi |
| localStorage (như app này) | Dữ liệu nhỏ, vài nghìn dòng, một máy |
| IndexedDB (cơ sở dữ liệu trong trình duyệt) | PWA có dữ liệu lớn hơn, nhiều bảng |
| File Excel | Người dùng muốn mở xem, sửa trực tiếp |
| SQLite (một file cơ sở dữ liệu) | Script Python/ứng dụng máy tính, dữ liệu nhiều |
| Cơ sở dữ liệu máy chủ | Nhiều người dùng chung, cần cho phép và bảo mật |

## SQL – hỏi dữ liệu bằng câu gần tiếng Anh
~~~sql
SELECT v.ten, SUM(c.so_luong) AS tong_xuat
FROM CHI_TIET c JOIN PHIEU p ON c.so_phieu = p.so_phieu
                JOIN VAT_TU v ON c.ma_vt = v.ma_vt
WHERE p.loai = 'Xuất' AND p.ngay LIKE '2026-11%'
GROUP BY v.ten;
~~~
Đọc: "Lấy tên vật tư và tổng số lượng xuất, ghép các bảng theo mã, chỉ lấy phiếu xuất tháng 11, nhóm theo tên." Bạn không cần tự viết SQL; chỉ cần **đọc hiểu** để kiểm tra AI viết đúng điều kiện.
`,

1. **Bản đặc tả + thiết kế dữ liệu** (buổi 34–35) → dán vào Project làm tài liệu nền.

## Công cụ AI lập trình (agent)
Ngoài trò chuyện, có các công cụ AI lập trình làm việc trực tiếp trên thư mục dự án: đọc file, viết code, chạy thử, sửa lỗi (ví dụ Claude Code; tên và tính năng cần kiểm tra lại). Rất mạnh, nhưng áp dụng nguyên tắc agent của buổi 17: thư mục riêng cho dự án, không chứa dữ liệu thật, duyệt kế hoạch trước.

| Kịch bản | Mong đợi |

"Không chạy" là mô tả vô dụng. Mẫu tốt:
~~~
Bước làm: vào Phiếu → Thêm phiếu xuất → chọn Chăn → nhập 5 → Lưu.
Mong đợi: tồn Chăn giảm từ 20 xuống 15.
Thực tế: tồn vẫn 20, không có thông báo gì.
Thiết bị: iPhone, Safari, app đã cài lên màn hình chính.

- **Hướng dẫn sử dụng** ngắn: cài đặt, các thao tác chính, sao lưu.

## Với phần mềm dùng ở cơ quan
Phần mềm xử lý dữ liệu nghiệp vụ của cơ quan cần **được chỉ huy đơn vị cho phép**, tuân thủ quy định bảo mật, quy định CNTT của ngành. Làm thử bằng dữ liệu giả, trình bày đề xuất (bản đặc tả + bản chạy thử) với cấp có thẩm quyền trước khi dùng dữ liệu thật.

content: `
## Vấn đề quen thuộc
"Hôm qua app chạy tốt, hôm nay nhờ AI thêm một tính năng thì hỏng hết, mà không nhớ bản cũ ở đâu." Giải pháp: **quản lý phiên bản**.

## Cách đơn giản: thư mục theo phiên bản
~~~
SoTayTrangCap/
  v1.0_2026-11-20/
  v1.1_2026-11-27_them-bao-cao-ton/
  v1.2_2026-12-05_sua-loi-huy-phieu/
  NHAT_KY_THAY_DOI.txt
~~~
Mỗi lần thay đổi lớn: chép cả thư mục ra bản mới, ghi 1 dòng vào nhật ký thay đổi. Đủ dùng cho dự án nhỏ.

## Cách chuyên nghiệp: Git
**Git** là công cụ miễn phí ghi lại **từng lần thay đổi** của mã nguồn ("commit"), cho phép xem khác biệt và quay lại bất kỳ lúc nào. Mọi lập trình viên đều dùng.
~~~
git init                         bắt đầu theo dõi thư mục
git add .                        chọn tất cả thay đổi
git commit -m "Thêm báo cáo tồn"  lưu một mốc có ghi chú
git log --oneline                xem danh sách các mốc
git diff                         xem đã sửa những gì từ mốc trước
git checkout <mã-mốc> -- index.html   lấy lại file từ một mốc cũ
~~~
Cài Git từ git-scm.com. VS Code có sẵn giao diện Git (biểu tượng nhánh cây bên trái), bấm chuột thay vì gõ lệnh.

## Quy tắc làm việc với AI + Git
1. **Commit trước khi nhờ AI sửa.** Hỏng thì quay lại ngay.
2. **Mỗi commit một thay đổi**, ghi chú rõ: "Sửa lỗi hủy phiếu không khôi phục tồn".
3. Dùng **git diff** xem AI đã sửa những gì. AI hay sửa lan sang chỗ không cần sửa.
4. Có thể đưa kho lên GitHub (kho riêng tư) để có bản sao ngoài máy. **Không bao giờ** đưa dữ liệu thật, mật khẩu, khóa API lên đó.

## Hai loại sao lưu khác nhau
| Loại | Là gì | Cách |
| Mã nguồn | Phần mềm (index.html, sw.js...) | Git / thư mục phiên bản |
| Dữ liệu người dùng | Số liệu đã nhập (localStorage, file Excel, SQLite) | Nút Sao lưu, lịch sao lưu hằng tuần, giữ nhiều bản |

## Cập nhật phần mềm mà không mất dữ liệu
- **Không đổi tên khóa lưu trữ** (ví dụ "sthai.trades") giữa các phiên bản; nếu đổi cấu trúc dữ liệu, nhờ AI viết đoạn **chuyển đổi dữ liệu cũ sang mới**.
- Với PWA: tăng phiên bản cache trong sw.js.
- Luôn **sao lưu dữ liệu trước khi cập nhật**.
`,

## Prompt video: mô tả CHUYỂN ĐỘNG
Ảnh đã có hình; prompt video chỉ cần nói **cái gì chuyển động và chuyển động thế nào**:
- Chuyển động nhân vật: slowly raises his head, looks at the sky.

- Môi trường: leaves gently moving, light flickering.
Càng ít chuyển động phức tạp, càng ít lỗi (tay biến dạng, mặt méo). Người, tay và chữ là những thứ AI video hay làm hỏng nhất.

## Giữ nhân vật nhất quán
1. **Mô tả nhân vật cố định**, lặp lại y nguyên ở mọi cảnh (tóc, áo, độ tuổi, dáng).

- Kéo tất cả clip vào một lượt theo tên file đã đánh số (canh_01, canh_02...). **Đặt tên file theo số cảnh** ngay từ khâu tạo video.

- Viết lời dẫn **để nghe**: câu ngắn, ít số liệu, không viết tắt.

## Bản quyền và đạo đức (bắt buộc)
| Không được | Nên |

| Nội dung có thể nhận diện người cai nghiện thật | Nhân vật, bối cảnh hư cấu; không dùng ảnh thật |

- Cùng một việc lặp lại cho **nhiều file**: tóm tắt 50 văn bản, phân loại 500 dòng ghi chú, chuẩn hóa tên hàng.

## Chuẩn bị
1. Tạo tài khoản nhà phát triển ở trang API của nhà cung cấp (ví dụ trang Console của Anthropic cho Claude), nạp tiền hoặc gói dùng thử nếu có. Quy trình và giá **cần kiểm tra lại** trên trang chính thức.

## Cất khóa API đúng cách: biến môi trường
**Không bao giờ** dán khóa thẳng vào code (dễ lộ khi chia sẻ code, đưa lên GitHub). Trên Windows, mở PowerShell:
~~~
setx ANTHROPIC_API_KEY "dán-khóa-của-bạn-vào-đây"
~~~
Đóng và mở lại VS Code. Thư viện tự đọc khóa từ biến môi trường.

## Script đầu tiên
~~~python
import anthropic

client = anthropic.Anthropic()            # tự đọc khóa từ biến môi trường ANTHROPIC_API_KEY
tra_loi = client.messages.create(
    model="claude-sonnet-5-5",            # tên model: kiểm tra lại trong tài liệu chính thức
    max_tokens=500,                       # giới hạn độ dài trả lời = giới hạn chi phí
    system="Bạn là trợ lý tóm tắt văn bản hành chính, trả lời tiếng Việt, ngắn gọn.",
    messages=[{"role": "user", "content": "Tóm tắt trong 3 gạch đầu dòng: ..."}],
)
print(tra_loi.content[0].text)
~~~
- **system**: hướng dẫn cố định (giống master prompt, buổi 6).
- **messages**: nội dung bạn gửi.
- **max_tokens**: chặn trả lời quá dài.

## Xử lý hàng loạt
~~~python
from pathlib import Path
for tep in sorted(Path("van_ban").glob("*.txt")):
    noi_dung = tep.read_text(encoding="utf-8")
    kq = client.messages.create(model="claude-sonnet-5-5", max_tokens=400,
        messages=[{"role": "user", "content": "Tóm tắt 3 ý chính:\n\n" + noi_dung}])
    Path("tom_tat", tep.stem + "_tomtat.txt").write_text(kq.content[0].text, encoding="utf-8")
    print("Xong:", tep.name)
~~~
(Cần tạo sẵn thư mục tom_tat.)

## Kiểm soát chi phí và rủi ro
| Việc | Vì sao |
| Chạy thử với 2–3 file trước | Kiểm tra kết quả và ước tính chi phí |
| Đặt max_tokens hợp lý | Chặn trả lời dài tốn tiền |
| Đặt giới hạn chi tiêu trên trang quản lý | Tránh hóa đơn bất ngờ khi code lặp lỗi |
| Dùng model nhỏ hơn cho việc đơn giản | Rẻ hơn nhiều; việc khó mới cần model mạnh |
| Ghi log từng file đã xử lý | Lỗi giữa chừng thì chạy tiếp, không chạy lại từ đầu |

> Mục đích buổi này là học cách **kiểm chứng** và **loại bỏ** ý tưởng, không phải tìm "chiến lược thắng". Quy tắc dùng làm ví dụ (hai đường trung bình) chỉ để minh họa kỹ thuật, **không phải khuyến nghị giao dịch**. Lưu ý pháp lý ở buổi 22 vẫn nguyên giá trị.

## Lấy dữ liệu giá lịch sử
Trong MetaTrader 5 (máy tính): View → Symbols (Ctrl+U) → tab Bars → chọn mã, khung thời gian, khoảng ngày → Request → Export Bars → lưu CSV. Thao tác có thể khác theo phiên bản, cần kiểm tra lại. Dữ liệu demo/của sàn có thể có sai sót, khoảng trống.

## Backtest tối giản, không nhìn trước tương lai
~~~python
import pandas as pd

df = pd.read_csv("XAUUSD_H1.csv")              # cột: time, open, high, low, close
df["ma_nhanh"] = df["close"].rolling(20).mean()
df["ma_cham"] = df["close"].rolling(50).mean()
df["tin_hieu"] = (df["ma_nhanh"] > df["ma_cham"]).astype(int)   # 1 = muốn giữ lệnh mua

# Quyết định ở nến t chỉ được dùng từ nến t+1: dịch tín hiệu xuống 1 dòng
df["vi_the"] = df["tin_hieu"].shift(1).fillna(0)
df["lai_lo_gia"] = df["vi_the"] * df["close"].diff()

CHI_PHI = 0.30          # chi phí giả định mỗi lần vào/ra (spread...), chỉnh theo thực tế
df["so_lan_doi"] = df["vi_the"].diff().abs().fillna(0)
df["ket_qua"] = df["lai_lo_gia"] - df["so_lan_doi"] * CHI_PHI
df["luy_ke"] = df["ket_qua"].cumsum()
print("Tổng (USD giá/1 oz):", round(df["ket_qua"].sum(), 2))
print("Sụt giảm lớn nhất:", round((df["luy_ke"] - df["luy_ke"].cummax()).min(), 2))
~~~
Dòng quan trọng nhất là **shift(1)**: không có nó, code "biết" giá đóng cửa trước khi quyết định, kết quả đẹp giả tạo.

## Tách dữ liệu: trong mẫu và ngoài mẫu
- **Trong mẫu** (ví dụ 70% thời gian đầu): được thử, chỉnh thông số.
- **Ngoài mẫu** (30% cuối): **chỉ chạy một lần** với thông số đã chốt.
Kết quả ngoài mẫu tệ hơn hẳn → dấu hiệu **quá khớp**. Nâng cao hơn: **walk-forward**, lặp lại chỉnh–kiểm tra trên nhiều đoạn thời gian nối tiếp.

## Monte Carlo: chuỗi thua có thể tệ đến đâu?
Lấy danh sách kết quả từng lệnh (từ backtest hoặc nhật ký), **xáo trộn thứ tự** hàng nghìn lần, mỗi lần tính mức sụt vốn lớn nhất. Bạn thấy được **phân bố** sụt vốn, không chỉ một con số may mắn của lịch sử.
~~~python
import random
ket_qua_lenh = [12.5, -8, -10, 25, -9, 18, -11, -7, 30, -10]   # lãi/lỗ từng lệnh (thay bằng dữ liệu của bạn)
sut_max = []
for _ in range(5000):
    random.shuffle(ket_qua_lenh)
    von, dinh, sut = 0, 0, 0
    for x in ket_qua_lenh:
        von += x; dinh = max(dinh, von); sut = min(sut, von - dinh)
    sut_max.append(sut)
sut_max.sort()
print("95% trường hợp sụt không quá:", sut_max[int(0.05 * len(sut_max))])
~~~

## Danh sách kiểm tra một backtest
- Có shift (không nhìn trước tương lai)?
- Có tính chi phí (spread, commission, swap)?
- Đủ số lệnh (hàng trăm, không phải vài chục)?
- Ngoài mẫu có giữ được kết quả?
- Sụt vốn tệ nhất (Monte Carlo) bạn có chịu nổi về tài chính và tâm lý?
- Ít thông số (càng nhiều thông số càng dễ quá khớp)?

## Các mức tự động hóa
| Mức | Mô tả | Ví dụ |
| 0 | Làm tay | Gõ biên bản từng ngày |
| 1 | Bấm một nút | Chạy script tạo biên bản khi cần |
| 2 | Chạy theo lịch | Mỗi sáng thứ Hai tự gộp file tuần trước |
| 3 | Agent làm nhiều bước, người duyệt điểm chốt | Agent gộp số liệu, soạn báo cáo nháp, chờ bạn duyệt |
| 4 | Agent tự làm từ đầu đến cuối | Ít khi phù hợp với việc cơ quan |
Với công việc kế toán ở cơ quan, **mức 1–3 là hợp lý**. Điểm ký, duyệt, gửi luôn do người làm.

## Chạy script theo lịch trên Windows: Task Scheduler
1. Mở **Task Scheduler** (gõ tìm trong Start).
2. Create Basic Task → đặt tên → chọn lịch (Daily/Weekly).
3. Action: Start a program → Program: đường dẫn python.exe (hoặc py) → Add arguments: tên file script → Start in: thư mục chứa script.
4. Máy phải bật vào giờ đó. Giao diện có thể khác chút theo phiên bản, cần kiểm tra lại.

## Script chạy tự động phải "biết tự báo cáo"
Khi không có người ngồi xem, script cần:
- **Ghi nhật ký (log)** vào file: thời gian chạy, số file xử lý, lỗi nếu có.
- **Không ghi đè** file gốc; ghi kết quả vào thư mục theo ngày.
- **Dừng an toàn khi gặp bất thường** (thiếu file, tổng lệch) và ghi rõ lý do, thay vì cố chạy tiếp.
- Tùy chọn: tạo file "CAN_KIEM_TRA.txt" khi có cảnh báo để bạn nhìn thấy ngay.

## Tác vụ định kỳ với trợ lý AI
Một số trợ lý AI có tính năng **tác vụ theo lịch** (ví dụ mỗi sáng tổng hợp tin tức một chủ đề, mỗi tuần nhắc lịch học). Tên và cách bật khác nhau theo công cụ, cần kiểm tra lại. Phù hợp với việc dùng **thông tin công khai**; không dùng cho dữ liệu nội bộ.

## Thiết kế quy trình có điểm duyệt của người
~~~
[Tự động] Gộp file đặt hàng tuần → [Tự động] Tính tổng, đối chiếu định mức
→ [Tự động] Tạo biên bản nháp + danh sách cảnh báo
→ [NGƯỜI] Kiểm tra cảnh báo, đối chiếu chứng từ → [NGƯỜI] Ký, lưu hồ sơ
~~~
Máy làm phần lặp lại; người làm phần **phán đoán và chịu trách nhiệm**.

## Khi nào KHÔNG nên tự động hóa
- Việc làm **vài lần một năm**: thời gian làm công cụ lớn hơn thời gian tiết kiệm.
- Quy trình **chưa ổn định**, mẫu biểu thay đổi liên tục.
- Việc cần **phán đoán**, xử lý ngoại lệ nhiều.
- Việc **không hoàn tác được**: gửi văn bản, chuyển tiền, xóa dữ liệu.
- Khi bạn **không hiểu** công cụ làm gì: không kiểm tra được thì không nên giao.
Công thức nhanh: **thời gian tiết kiệm mỗi lần × số lần mỗi năm** so với **thời gian làm + bảo trì công cụ**.
`,
